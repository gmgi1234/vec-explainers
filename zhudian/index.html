<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>注册电气工程师 · 基础考试知识库</title>
<style>
:root{
  --bg:#0e1116; --panel:#151a21; --panel2:#1b212a; --border:#242c37;
  --text:#e6edf3; --muted:#8b949e; --dim:#6e7681;
  --accent:#4c8dff; --accent-soft:rgba(76,141,255,.14);
  --mark:#ffb648; --mark-soft:rgba(255,182,72,.13);
  --ok:#3fb950; --warn:#f0883e; --danger:#f85149;
  --radius:12px; --maxw:820px;
}
[data-theme="light"]{
  --bg:#fbfcfd; --panel:#ffffff; --panel2:#f3f6f9; --border:#dfe5ec;
  --text:#1b232c; --muted:#5b6672; --dim:#7b8794;
  --accent:#2563eb; --accent-soft:rgba(37,99,235,.10);
  --mark:#b26b00; --mark-soft:rgba(178,107,0,.11);
  --ok:#1a7f37; --warn:#9a5b00; --danger:#cf222e;
  color-scheme:light;
}
/* 浅色下把深色阴影换掉，否则会像脏污 */
[data-theme="light"] .searchbox{box-shadow:0 18px 50px rgba(16,24,40,.14)}
[data-theme="light"] .toast{box-shadow:0 8px 24px rgba(16,24,40,.12)}
[data-theme="light"] .overlay{background:rgba(16,24,40,.30)}
[data-theme="light"] .drawer .bd{background:rgba(16,24,40,.30)}
[data-theme="light"] .videowrap video{background:#eef1f5}
[data-theme="light"] .doc blockquote{background:#f1f5f9}
[data-theme="light"] tbody tr:nth-child(even){background:rgba(15,23,42,.025)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font:15px/1.72 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-text-size-adjust:100%;
  padding-bottom:64px;
}
@media (min-width:900px){ body{padding-bottom:24px} }
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em;
  background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:.1em .38em;white-space:nowrap}
hr{border:0;border-top:1px solid var(--border);margin:26px 0}
table{border-collapse:collapse;width:100%;font-size:14px;margin:14px 0}
th,td{border:1px solid var(--border);padding:8px 11px;text-align:left;vertical-align:top}
th{background:var(--panel2);font-weight:600;white-space:nowrap}
tbody tr:nth-child(even){background:rgba(127,127,127,.035)}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:14px 0;border-radius:8px}
.tw table{margin:0}

/* ---------- shell ---------- */
.topbar{
  position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--border);
}
.brand{font-weight:700;font-size:15px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.spacer{flex:1}
.iconbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  height:34px;min-width:34px;padding:0 10px;border-radius:9px;
  background:var(--panel);border:1px solid var(--border);color:var(--text);
  font:inherit;font-size:13px;cursor:pointer;transition:.16s;
  white-space:nowrap;flex:0 0 auto;
}
@media (max-width:470px){
  .topbar{gap:7px;padding:8px 11px}
  .brand{font-size:13.5px}
  .brand span{display:none}
  .iconbtn{height:32px;min-width:32px;padding:0 8px;font-size:12.5px}
}
.iconbtn:hover{background:var(--panel2)}
.iconbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

.layout{display:flex;max-width:1240px;margin:0 auto;align-items:flex-start}
.side{display:none}
@media (min-width:900px){
  .side{display:block;position:sticky;top:56px;width:250px;flex:0 0 250px;
        padding:18px 10px 40px 16px;max-height:calc(100vh - 56px);overflow-y:auto}
}
.main{flex:1;min-width:0;padding:20px 16px 40px}
@media (min-width:900px){ .main{padding:24px 28px 60px} .inner{max-width:var(--maxw)} }
.inner{max-width:var(--maxw);margin:0 auto}

/* ---------- nav ---------- */
.navlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.navlist button{
  width:100%;display:flex;align-items:center;gap:9px;text-align:left;
  padding:9px 11px;border-radius:9px;background:transparent;border:0;
  color:var(--muted);font:inherit;font-size:13.5px;cursor:pointer;transition:.14s;
}
.navlist button:hover{background:var(--panel);color:var(--text)}
.navlist button.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navlist .n{margin-left:auto;font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
.navlist button.active .n{color:var(--accent)}
.navsec{font-size:11px;letter-spacing:.9px;color:var(--dim);text-transform:uppercase;
  padding:16px 11px 7px;font-weight:600}

/* ---------- doc ---------- */
.doc h1{font-size:23px;line-height:1.3;margin:4px 0 6px;letter-spacing:-.2px}
.doc h2{font-size:18px;margin:34px 0 12px;padding-top:16px;border-top:1px solid var(--border);letter-spacing:-.1px}
.doc hr+h2,.doc hr+h3{margin-top:16px;padding-top:0;border-top:0}
.doc h3{font-size:15.5px;margin:24px 0 8px;color:var(--text)}
.doc h4{font-size:14.5px;margin:18px 0 6px;color:var(--muted)}
.doc p{margin:10px 0}
.doc ul,.doc ol{margin:10px 0;padding-left:22px}
.doc li{margin:5px 0}
.doc li>ul,.doc li>ol{margin:5px 0}
.doc blockquote{
  margin:14px 0;padding:11px 15px;border-left:3px solid var(--accent);
  background:var(--panel);border-radius:0 8px 8px 0;color:var(--text);
}
.doc blockquote p{margin:4px 0}
.doc blockquote p:first-child{margin-top:0}
.doc blockquote p:last-child{margin-bottom:0}

/* marking */
.mk{position:relative;cursor:pointer;border-radius:7px;transition:background .14s;scroll-margin-top:64px}
@media (hover:hover){ .mk:hover{background:rgba(127,127,127,.055)} }
.mk.on{background:var(--mark-soft);box-shadow:inset 3px 0 0 var(--mark)}
.mk.on>td:first-child,.mk.on>th:first-child{box-shadow:inset 3px 0 0 var(--mark)}
.doc h1.mk,.doc h2.mk,.doc h3.mk,.doc h4.mk{cursor:pointer}
.doc p.mk,.doc li.mk,.doc blockquote.mk{padding-left:8px;margin-left:-8px}
tr.mk>td{background:transparent}
tr.mk.on>td{background:var(--mark-soft)}
tr.mk.on>td:first-child{border-left:3px solid var(--mark)}

/* blur / recall mode */
body.blur .doc strong,.doc.blur strong,
body.blur .doc code,
body.blur .doc blockquote strong{
  filter:blur(5px);cursor:pointer;transition:filter .18s;border-radius:3px;
}
body.blur .doc strong:hover,body.blur .doc code:hover,
body.blur .doc strong.revealed,body.blur .doc code.revealed{filter:none}
body.blur .doc strong:active,body.blur .doc code:active{filter:none}

/* ---------- dashboard ---------- */
.hero{
  padding:22px;border-radius:var(--radius);border:1px solid var(--border);
  background:linear-gradient(150deg,var(--panel2),var(--panel));
  margin-bottom:20px;
}
.hero h1{font-size:24px;margin:0 0 6px;letter-spacing:-.3px}
.hero p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.65}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:10px;margin:18px 0 4px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 13px}
.stat b{display:block;font-size:20px;line-height:1.2;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.stat small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px}
.stat.hi b{color:var(--accent)}
.stat.mk b{color:var(--mark)}

.cards{display:grid;grid-template-columns:1fr;gap:11px;margin-top:18px}
@media (min-width:620px){ .cards{grid-template-columns:1fr 1fr} }
.card{
  display:block;text-align:left;width:100%;padding:15px 16px;border-radius:11px;
  background:var(--panel);border:1px solid var(--border);color:inherit;
  font:inherit;cursor:pointer;transition:.16s;
}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card .ct{font-weight:650;font-size:14.5px;display:flex;align-items:center;gap:8px}
.card .cd{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.55}
.card .cb{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}
.pill{font-size:11px;padding:2.5px 8px;border-radius:20px;background:var(--panel2);
  border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.pill.a{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.pill.m{background:var(--mark-soft);border-color:transparent;color:var(--mark)}

/* ---------- search ---------- */
.overlay{
  position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.55);
  display:none;padding:14px;backdrop-filter:blur(3px);
}
.overlay.open{display:block}
.searchbox{
  max-width:660px;margin:0 auto;background:var(--panel);border:1px solid var(--border);
  border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4);
  display:flex;flex-direction:column;max-height:min(76vh,700px);
}
.searchbar{display:flex;align-items:center;gap:9px;padding:13px 15px;border-bottom:1px solid var(--border)}
.searchbar input{
  flex:1;background:transparent;border:0;outline:0;color:var(--text);
  font:inherit;font-size:15px;min-width:0;
}
.results{overflow-y:auto;padding:7px}
.result{
  display:block;width:100%;text-align:left;padding:10px 12px;border-radius:9px;
  background:transparent;border:0;color:inherit;font:inherit;cursor:pointer;margin-bottom:2px;
}
.result:hover,.result.sel{background:var(--panel2)}
.result .rr{font-size:11px;color:var(--accent);margin-bottom:2px;font-weight:600}
.result .rt{font-size:13.5px;line-height:1.5;color:var(--text)}
.result mark{background:var(--mark-soft);color:var(--mark);padding:0 2px;border-radius:3px}
.empty{padding:28px 16px;text-align:center;color:var(--dim);font-size:13px}

/* ---------- mobile drawer ---------- */
.drawer{
  position:fixed;inset:0;z-index:85;display:none;
}
.drawer.open{display:block}
.drawer .bd{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.drawer .pn{
  position:absolute;left:0;top:0;bottom:0;width:min(80vw,300px);
  background:var(--panel);border-right:1px solid var(--border);
  padding:18px 12px;overflow-y:auto;animation:slide .2s ease-out;
}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(0)}}

/* ---------- misc ---------- */
.videowrap{margin:18px 0;padding:14px;border-radius:var(--radius);
  background:var(--panel);border:1px solid var(--border)}
.videowrap h3{margin:0 0 3px;font-size:14.5px}
.videowrap .vs{font-size:12px;color:var(--muted);margin:0 0 10px}
.videowrap video{display:block;width:100%;max-width:660px;border-radius:9px;background:#000}
.banner{
  display:flex;gap:9px;align-items:flex-start;padding:11px 13px;border-radius:9px;
  background:var(--panel2);border:1px solid var(--border);font-size:12.5px;
  color:var(--muted);line-height:1.6;margin:16px 0;
}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0 6px}
.toast{
  position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(14px);
  background:var(--panel2);border:1px solid var(--border);color:var(--text);
  padding:9px 16px;border-radius:10px;font-size:13px;z-index:120;
  opacity:0;pointer-events:none;transition:.22s;box-shadow:0 8px 28px rgba(0,0,0,.3);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--border);
  font-size:12px;color:var(--dim);line-height:1.7}
@media print{
  .topbar,.side,.drawer,.overlay,.toolbar,footer .noprint{display:none!important}
  body{background:#fff;color:#000}
}
</style>
</head>
<body>

<div class="topbar">
  <button class="iconbtn" id="menuBtn" aria-label="目录" style="display:none">☰</button>
  <div class="brand">注册电气工程师 · 基础考试<span>知识库</span></div>
  <div class="spacer"></div>
  <button class="iconbtn" id="searchBtn" aria-label="搜索">🔍<span class="lbl" style="display:none">搜索</span></button>
  <button class="iconbtn" id="blurBtn" aria-pressed="false" aria-label="自测模式" title="自测模式：模糊公式，点开才显示">自测</button>
  <button class="iconbtn" id="themeBtn" aria-label="切换主题">◐</button>
</div>

<div class="layout">
  <aside class="side">
    <nav class="navlist" id="navDesktop"></nav>
  </aside>
  <main class="main">
    <div class="inner" id="view"></div>
    <footer>
      <div class="noprint">
        <b>用法</b>：点任意段落 / 列表项 / 表格行可「圈重点」，自动存在本机；开启「自测」后关键公式会模糊，点一下才显示。
      </div>
      <div style="margin-top:8px">公式经核对，如与当年教材或现行规范有出入，以教材 / 规范为准。考试政策以当年省级人事考试网通知为准。</div>
    </footer>
  </main>
</div>

<div class="drawer" id="drawer">
  <div class="bd" data-close="1"></div>
  <div class="pn"><nav class="navlist" id="navMobile"></nav></div>
</div>

<div class="overlay" id="overlay">
  <div class="searchbox">
    <div class="searchbar">
      <span style="color:var(--dim)">🔍</span>
      <input id="q" type="search" placeholder="搜索公式、概念、陷阱…" autocomplete="off" spellcheck="false">
      <button class="iconbtn" data-close="1" style="height:28px;min-width:28px;padding:0 8px">Esc</button>
    </div>
    <div class="results" id="results"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   DATA  —— 由构建脚本注入

const DATA = {"docs":[{"id":"plan","title":"备考路线","sub":"时间线、分数账、12 个月计划、考场细节","pills":[{"t":"2027 基础","k":"a"},{"t":"300–400h","k":""},{"t":"132 / 240","k":""}],"md":"# 注册电气工程师（发输变电）备考路线 · 确定版\n\n> 制定日期：2026-11-04\n> 现状：电气工程及其自动化本科 / 电力设计院 / 基础未过\n> 目标：2027 年 10—11 月 通过基础考试 → 2028 年 专业考试\n\n---\n\n## 一、时间线（已锁定）\n\n| 年份 | 任务 | 强度 |\n|---|---|---|\n| 2026.11 — 2027.11 | **基础考试**（唯一目标） | 约 300—400 小时 |\n| 2028 | **专业考试**（发输变电，两科必须当年全过） | 800—1500 小时 |\n\n**为什么 2027 只做基础：**\n- 基础合格是报专业考试的硬前提，报名时就查\n- 基础成绩**长期有效**，考一次管一辈子\n- 专业考试不滚动，2028 年必须一次过两科，那年才是真正的硬仗\n\n---\n\n## 二、基础考试的关键一笔账\n\n**结构**：1 天 2 场，全部单选题（四选一），共 **180 题 / 240 分**——上午 120 题、每题 1 分；下午 60 题、每题 2 分。\n**合格线：132 分（55%）**——注意不是 60%，容错空间比想象大。\n\n| 场次 | 科目 | 满分 |\n|---|---|---|\n| 上午 | 公共基础（数学、物理、化学、理论力学、材料力学、流体力学、电工电子技术、信号与信息、计算机基础、工程经济、法律法规） | 120 |\n| 下午 | 专业基础（电路与电磁场、模拟电子、数字电子、电气工程基础） | 120 |\n\n### 两场分值地图（按真题题号，数一遍就能核对）\n\n**上午 · 公共基础（120 题 / 120 分）**\n\n| 科目 | 题号 | 分值 |\n|---|---|---|\n| 高等数学 | 1—24 | 24 |\n| 普通物理 | 25—36 | 12 |\n| 普通化学 | 37—46 | 10 |\n| 理论力学 | 47—58 | 12 |\n| 材料力学 | 59—70 | 12 |\n| 流体力学 | 71—78 | 8 |\n| 电工电子技术 | 79—90 | 12 |\n| 信号与信息技术 | 91—96 | 6 |\n| 计算机应用基础 | 97—106 | 10 |\n| 工程经济 | 107—114 | 8 |\n| 法律法规 | 115—120 | 6 |\n\n**下午 · 专业基础（60 题 / 120 分，每题 2 分）**\n\n| 科目 | 题号 | 分值 |\n|---|---|---|\n| 电路与电磁场 | 1—15 | 30 |\n| 模拟电子技术 | 16—24 | 18 |\n| 数字电子技术 | 25—30 | 12 |\n| 电气工程基础 | 31—60 | 60 |\n\n> 这组题号是通用版，个别年份会有 1—2 题挪位；拿你手上最新一套真题数一遍，五分钟就能确认。\n> **电气工程基础一门 60 分，是下午场的半壁江山，比\"电路\"重要得多。**\n\n### 你是\"下半场型\"选手\n\n专业基础是你的本行，公共基础里的高数力学多半已经还给老师了。所以**不能平均用力**：\n\n| 策略 | 专业基础 | 公共基础 | 总分 | 结论 |\n|---|---|---|---|---|\n| 理想 | 102（85%） | 36（30%） | 138 | ✅ 过 |\n| 务实 | 96（80%） | 42（35%） | 138 | ✅ 过 |\n| 极限 | 108（90%） | 24（20%） | 132 | ⚠️ 刚好压线 |\n\n**结论：专业基础是提款机，公共基础只需保底。**\n\n全部蒙题期望分数约 60 分（240×25%），所以你真正要\"挣\"的只有 72 分。\n\n---\n\n## 三、12 个月计划\n\n| 阶段 | 时间 | 任务 | 周投入 |\n|---|---|---|---|\n| ① 摸底 | 2026.11 | 分两场做一套真题：先下午 60 题（2 小时），再上午 120 题（4 小时），只看分数不看对错 | 6 小时 |\n| ② 数学攻坚 | 2026.12 — 2027.2 | 高数：极限、导数、积分、级数、微分方程、线性代数、概率。**分值最大且最能短期提分** | 6 小时 |\n| ③ 三大力学 | 2027.3 — 2027.4 | 理论力学（静力学、运动学、动力学）、材料力学（强度、刚度、稳定性） | 6 小时 |\n| ④ 小科目扫尾 | 2027.5 — 2027.6 | 电工电子（送分）、工程经济（套路固定）、物理、化学、流体、法规、计算机、信号（只求眼熟） | 6 小时 |\n| ⑤ 专业基础 | 2027.7 — 2027.8 | 电路与电磁场、模电、数电、电气工程基础——**以做题定位，不从教材第一页开始看** | 8 小时 |\n| ⑥ 报名 | 2027.8 | 多数省份 8 月开放报名，材料（社保、单位证明）提前两个月备好，别拖到最后一天 | — |\n| ⑦ 真题三遍 | 2027.9 — 2027.10 | 第 1 遍限时、第 2 遍按题型归类、第 3 遍只做错题 | 10 小时 |\n| ⑧ 考前两周 | 考前 | 记忆型小科目突击（化学、法规、信号、计算机）+ 模拟 | 全力 |\n\n---\n\n## 四、公共基础：怎么取舍\n\n**投入产出排序（我的建议）：**\n\n| 优先级 | 科目 | 理由 |\n|---|---|---|\n| 🔴 重点 | 数学 | 分值最大，且是纯计算，会就是会 |\n| 🔴 重点 | 理论力学 / 材料力学 | 分值大，公式固定，题感可练 |\n| 🟡 划算 | 电工电子技术 | 你的送分项，几乎不用复习 |\n| 🟡 划算 | 工程经济 | 就那几个公式（现值、终值、内部收益率），套路极固定 |\n| 🟢 眼熟 | 物理、化学、流体力学 | 记忆型小分，考前突击即可 |\n| 🟢 眼熟 | 法律法规、计算机基础 | 同上 |\n| ⚫ 放弃 | 信号与信息技术 | 分少、难、投入产出比最差，会就做不会就蒙 |\n\n---\n\n## 五、专业基础：怎么打\n\n四门：**电气工程基础（60 分，占一半）**、电路与电磁场（30 分）、模拟电子（18 分）、数字电子（12 分）。\n\n**核心方法：不要从头看教材。**\n\n1. 先做一章真题，错哪补哪\n2. 电路是根基，电路不熟会连带影响模电数电\n3. 电气工程基础对电力院的人偏\"复习\"——发电机、变压器、电力系统、继电保护，日常都在接触\n\n---\n\n## 六、考场细节（现在就该准备）\n\n1. **只许带计算器**：无声、无文本存储功能。卡西欧 fx-991 系列这类可以。**现在就买，练熟**——考场上换新计算器是灾难\n2. **闭卷**，不提供任何公式表 → 公式必须背到肌肉记忆，这和 2028 年专业考试（开卷）正好相反\n3. **上午 8:00—12:00 做 120 题（2 分钟/题），下午 14:00—18:00 做 60 题（4 分钟/题）**——下午每题 2 分，错一题顶上午两题，宁可慢一点\n4. 全单选无倒扣 → **不会就蒙，务必填满**\n\n---\n\n## 七、2028 专业考试（发输变电）前瞻\n\n现在不用准备，但可以先知道战场长什么样：\n\n**核心资料**\n- 《电力工程电气设计手册》电气一次部分、电气二次部分（西北电力设计院编）\n- 电力行业规范汇编\n\n**核心规范（先记名字）**\n- GB 50059 35~110kV 变电站设计规范\n- GB 50060 3~110kV 高压配电装置设计规范\n- GB 50061 66kV 及以下架空电力线路设计规范\n- GB 50062 电力装置的继电保护和自动装置设计规范\n- GB 50064 交流电气装置的过电压保护和绝缘配合\n- GB 50065 交流电气装置的接地设计规范\n- DL/T 5222 导体和电器选择设计技术规定\n- DL/T 5153 火力发电厂厂用电设计技术规程\n- GB 50217 电力工程电缆设计标准\n\n**案例高频题型**\n短路电流计算（标幺值）、导体与电器选择（热稳定/动稳定）、厂用电接线、继电保护整定、防雷保护范围、接地计算、过电压与绝缘配合、直流系统、电缆截面选择、无功补偿\n\n**难度提示**：发输变电专业考试通过率业内估计仅 5—8%，是勘察设计里最难的之一。下午 40 题选 25 题，计算量极大。所以 2028 年要预留整年。\n\n---\n\n## 八、和中级经济师的冲突（重要）\n\n**2027 年秋季只能有一个主角。**\n\n注电基础和经济师都在 10—11 月开考，冲刺期完全撞车。两个都想要，最可能的结果是两个都差一点。\n\n我的建议：\n\n| 年份 | 优先级 | 说明 |\n|---|---|---|\n| 2027 | **注电基础** | 单位刚需 + 有窗口期，不可替代 |\n| 2028 | **注电专业** | 最难的一年，绝不叠加 |\n| 2029 | 经济师 | 职称没有窗口期，晚两年毫无影响 |\n\n如果你必须 2027 年拿经济师，那就把注电基础推到 2028、专业推到 2029——但这条路的代价是整条链推迟两年，一般不划算。\n\n---\n\n## 九、本月就做的三件事\n\n1. **买计算器**（若无）：卡西欧 fx-991 系列，从今天开始用它做题\n2. **掐时间做一套真题**：分两场，先下午 60 题（2 小时）再上午 120 题（4 小时），只看分数。这是你唯一一次\"无成本摸底\"\n3. **确认毕业年限**：本科 4 年（通过住建部专业教育评估）/ 5 年（未通过）。查母校是否在名单内，算出 2028 年是否有资格报专业考试\n\n---\n\n> 说明：每年各省报名条件、社保审核口径、考试日期均有微调。具体以当年省级人事考试网通知为准。规范号与标准名称可能随修订更新，请核对现行有效版本。","videos":[]},{"id":"specialty","title":"专业基础 · 考点地图","sub":"下午场 120 分：电路电磁场、模电、数电、电气工程基础","pills":[{"t":"120 分","k":"a"},{"t":"你的提款机","k":"a"},{"t":"十个陷阱","k":""}],"md":"# 注册电气工程师 · 基础考试 专业基础考点地图\n\n> 下午场 120 分，四门：电路与电磁场、模拟电子、数字电子、电气工程基础。\n> **这是你该重点吃下的 120 分**——按 132 分合格线算，这里拿 80% 就基本稳了。\n> 本文件不替代教材，作用是把「考什么 / 用什么公式 / 哪里容易错」一次看清。\n\n---\n\n## 总览：四门怎么分配精力\n\n| 科目（约分值） | 你的基础 | 建议 |\n|---|---|---|\n| **电气工程基础（60）** | 强（电力院天天接触） | 最大一块，只做真题定位；但**磁路、主接线、防雷接地、互感器**要单独补（见第八—十一节） |\n| 电路与电磁场（30） | 强（电路）/ 弱（电磁场） | 电路快速过，**电磁场要补** |\n| 模拟电子（18） | 中 | 共射 + 运放 + 反馈 + **差分放大** |\n| 数字电子（12） | 中 | 卡诺图 + 触发器 + 计数器，套路化最强 |\n\n> 电磁场是最容易被低估的一门：电路你熟，但高斯定理、安培环路、坡印廷矢量这些，工作里不用就会忘。\n\n---\n\n# 第一部分 电路与电磁场\n\n## 一、电路基本概念\n\n- **参考方向**：电流从「+」流入元件为**关联参考方向**\n- 功率：**p = ui**\n  - 关联方向下 p > 0 → **吸收**功率\n  - 关联方向下 p < 0 → **发出**功率\n- 理想电压源、理想电流源、受控源（VCVS、VCCS、CCVS、CCCS）\n\n## 二、电阻电路分析方法\n\n| 方法 | 适用 |\n|---|---|\n| 节点电压法 | 节点少、支路多 |\n| 回路电流法 / 网孔法 | 回路少、支路多 |\n| 叠加定理 | 多个独立源，**功率不可叠加** |\n| 戴维南 / 诺顿 | 求某一支路 |\n| 电源等效变换 | 化繁为简 |\n\n**Y-Δ 变换**：对称时 **R_Y = R_Δ / 3**\n\n**最大功率传输**：R_L = R_eq 时，**P_max = U_oc² / (4R_eq)**\n\n**含受控源**：求等效电阻时用**外加电源法**（加压求流或加流求压），不能直接串并联。\n\n## 三、动态电路\n\n**一阶电路（三要素法）**\n> f(t) = f(∞) + [f(0₊) − f(∞)]·e^(−t/τ)\n- RC：τ = RC；RL：τ = L/R\n- 换路定则：u_C(0₊) = u_C(0₋)，i_L(0₊) = i_L(0₋)\n\n**二阶电路**（RLC 串联）\n特征方程：s² + (R/L)s + 1/(LC) = 0\n\n| 判别式 | 状态 | 响应 |\n|---|---|---|\n| R > 2√(L/C) | 过阻尼 | 两个不等负实根，非振荡 |\n| R = 2√(L/C) | 临界阻尼 | 重根 |\n| R < 2√(L/C) | 欠阻尼 | 共轭复根，衰减振荡 |\n\n## 四、正弦稳态\n\n- 阻抗：Z = R + j(ωL − 1/ωC)\n- **串联谐振**：ω₀ = 1/√(LC)，Z = R 最小，电流最大\n- 品质因数：Q = ω₀L/R = (1/R)√(L/C)\n- 并联谐振：ω₀ ≈ 1/√(LC)（高 Q 时）\n\n**功率**：P = UIcosφ，Q = UIsinφ，S = UI，S² = P² + Q²\n\n**耦合电感**：同名端决定互感项正负\n**理想变压器**：\n- u₁/u₂ = n₁/n₂ = k\n- i₁/i₂ = n₂/n₁\n- **阻抗变换**：Z₁ = k²·Z₂\n\n**三相电路**\n- Y：U_L = √3U_P，I_L = I_P\n- Δ：U_L = U_P，I_L = √3I_P\n- 功率：P = √3U_LI_Lcosφ\n\n**非正弦周期电路**\n- 有效值：I = √(I₀² + I₁² + I₂² + …)\n- 平均功率：P = P₀ + ΣP_k（各次谐波功率之和）\n\n## 五、二端口网络\n\n| 参数 | 方程 |\n|---|---|\n| Z 参数 | u₁ = Z₁₁i₁ + Z₁₂i₂；u₂ = Z₂₁i₁ + Z₂₂i₂ |\n| Y 参数 | i₁ = Y₁₁u₁ + Y₁₂u₂；i₂ = Y₂₁u₁ + Y₂₂u₂ |\n| A 参数 | u₁ = Au₂ − Bi₂；i₁ = Cu₂ − Di₂（传输参数） |\n| H 参数 | 混合参数，常用于三极管 |\n\n**互易网络**：Z₁₂ = Z₂₁；**对称网络**：Z₁₁ = Z₂₂\n\n## 六、电磁场（重点补）\n\n### 静电场\n- 库仑定律：F = q₁q₂/(4πε₀r²)\n- **高斯定理**：∮D·dS = Σq（D = εE）\n- 电位：V = q/(4πε₀r)\n- 电容：C = Q/U；平行板 **C = εS/d**\n- 电场能量：**W = ½CU²**\n\n### 恒定电场\n- 电流密度：J = I/S\n- 欧姆定律微分形式：**J = γE**（γ 为电导率）\n- 边界条件：法向 J 连续，切向 E 连续\n\n### 恒定磁场\n- **安培环路定理**：∮H·dl = ΣI\n- 磁通：Φ = BS\n- 电感：L = Ψ/I；长螺线管 **L = μN²S/l**\n- 磁场能量：**W = ½LI²**\n\n### 电磁感应\n- **法拉第定律**：e = −dΦ/dt（负号是楞次定律）\n- 自感电动势：e_L = −L·di/dt\n- 互感：e₂ = −M·di₁/dt\n\n### 麦克斯韦方程组（积分形式，四条必背）\n\n| 定律 | 表达式 |\n|---|---|\n| 高斯电定律 | ∮D·dS = Σq |\n| 高斯磁定律 | ∮B·dS = 0 |\n| 法拉第电磁感应 | ∮E·dl = −dΦ_B/dt |\n| 全电流定律 | ∮H·dl = ΣI + dΨ_D/dt |\n\n**位移电流**：I_d = dΨ_D/dt —— 麦克斯韦的核心贡献，说明**变化的电场产生磁场**。\n\n### 平面电磁波\n- 速度：v = 1/√(με)\n- 波阻抗：Z₀ = √(μ/ε)（真空中约 377 Ω）\n- **坡印廷矢量**：S = E × H（能流密度）\n- **趋肤深度**：δ = √(2/(ωμσ))，频率越高、电导率越大，透入越浅\n\n---\n\n# 第二部分 模拟电子技术\n\n## 一、半导体与二极管\n- PN 结：正向导通、反向截止、反向击穿\n- 硅管导通压降 **0.7 V**，锗管 0.3 V\n- **稳压管**工作在反向击穿区，稳定电压 U_Z\n\n## 二、三极管\n\n- 电流关系：**I_C = βI_B**，I_E = (1+β)I_B\n- 三个区：截止、放大、饱和\n- 饱和判据：U_CE ≈ 0.3 V，且 I_C < βI_B\n\n**三种组态对比**\n\n| 组态 | 电压增益 | 输入电阻 | 输出电阻 | 相位 |\n|---|---|---|---|---|\n| 共射 | 大 | 中 | 大 | 反相 |\n| 共集（射随） | ≈1 | **大** | **小** | 同相 |\n| 共基 | 大 | 小 | 大 | 同相 |\n\n## 三、共射放大电路（必考）\n\n**静态工作点**\n- I_B = (V_CC − U_BE)/R_B\n- I_C = βI_B\n- U_CE = V_CC − I_C·R_C\n\n**微变等效**\n- r_be = r_bb′ + (1+β)·26 mV/I_E\n- **A_u = −β·R_L′/r_be**\n- R_i ≈ R_B ∥ r_be\n- R_o ≈ R_C\n- **频率响应**：f_L（耦合/旁路电容决定）、f_H（结电容决定），带宽 BW = f_H − f_L；**增益带宽积基本恒定**，增益换带宽\n\n## 四、场效应管\n- JFET、MOSFET\n- 转移特性：I_D = I_DSS(1 − U_GS/U_P)²\n- 跨导：g_m = ΔI_D/ΔU_GS\n- 特点：输入电阻极高、噪声低、温度稳定性好\n\n## 五、反馈（高分考点）\n\n**四种组态**：电压串联、电压并联、电流串联、电流并联\n\n**判断方法**\n1. 输出端短路，反馈消失 → 电压反馈；否则电流反馈\n2. 输入端反馈信号与输入信号串联 → 串联；并联 → 并联\n\n**深度负反馈**：**A_f ≈ 1/F**\n\n**负反馈的作用**\n- 减小非线性失真\n- 扩展通频带\n- 改变输入/输出电阻（串联增大输入电阻，并联减小；电压反馈稳定输出电压，电流反馈稳定输出电流）\n- **降低增益**\n\n**自激振荡条件**：|AF| ≥ 1 且相位附加相移 ±180°\n\n## 六、运算放大器\n\n**理想运放两条铁律**\n- **虚短**：u₊ = u₋\n- **虚断**：i₊ = i₋ = 0\n\n| 电路 | 输出 |\n|---|---|\n| 反相比例 | u_o = −(R_f/R₁)u_i |\n| 同相比例 | u_o = (1 + R_f/R₁)u_i |\n| 加法 | u_o = −R_f(u₁/R₁ + u₂/R₂) |\n| 积分 | u_o = −(1/R₁C)∫u_i dt |\n| 微分 | u_o = −R₁C·du_i/dt |\n| 电压比较器 | 输出只有高、低两态（非线性应用） |\n\n**差分放大（高频考点）**\n- 作用：放大**差模**、抑制**共模**（零点漂移、干扰）\n- 双端输出：A_ud = −β·R_C / r_be；单端输出为一半\n- 共模抑制比：**K_CMR = |A_ud / A_uc|**，越大越好\n- 长尾电阻 R_e（或恒流源）越大，共模抑制越强\n- 单端输入时差模增益与双端输入相同（另一端交流接地）\n\n## 七、功率放大与电源\n\n- **甲类**：效率低（最高约 25%），失真小\n- **乙类**：效率高（**78.5%**），有**交越失真**\n- **甲乙类**：实际常用，消除交越失真\n- OCL（双电源）、OTL（单电源，输出电容）\n\n**整流**\n- 半波：U_o ≈ 0.45U₂\n- 桥式全波：U_o ≈ 0.9U₂\n- 加电容滤波后：U_o ≈ 1.2U₂\n\n**稳压**\n- 串联型稳压：取样 → 基准 → 比较放大 → 调整管\n- 三端稳压器：78xx（正电压）、79xx（负电压），xx 为输出值\n- 开关型稳压：效率 80%—95%，纹波较大\n\n---\n\n# 第三部分 数字电子技术\n\n## 一、逻辑代数与化简\n- 德摩根定律\n- 卡诺图：圈 1，圈最大、圈最少、可重叠、边角相邻；**无关项（d）可当 1 也可当 0**，用来凑更大的圈\n\n## 二、门电路\n- TTL：速度快、功耗大、输入端悬空视为高电平\n- CMOS：功耗低、抗干扰强、**输入端不能悬空**\n- 参数：扇出系数、噪声容限、传输延迟\n\n## 三、组合逻辑\n- 分析步骤：写表达式 → 化简 → 列真值表 → 说明功能\n- 设计步骤：真值表 → 卡诺图化简 → 画电路\n- 常用器件：编码器、译码器、数据选择器、加法器、比较器\n- **竞争冒险**：加冗余项或滤波电容消除\n\n## 四、时序逻辑\n\n**触发器特性方程**\n\n| 类型 | 特性方程 |\n|---|---|\n| RS | Q* = S + R′Q（RS 不能同时为 1） |\n| JK | **Q* = JQ′ + K′Q** |\n| D | **Q* = D** |\n| T | Q* = T ⊕ Q |\n\n**计数器**\n- 同步 / 异步\n- 任意模 N：反馈清零法（异步）或置数法（同步）\n- 模 N 计数器需要 ⌈log₂N⌉ 个触发器\n\n**寄存器与存储器**\n- 移位寄存器：串入串出 / 串入并出 / 并入串出 / 并入并出；环形、扭环形计数器\n- ROM 只读、断电不丢；RAM 读写、断电丢失；容量 = 字数 × 位数\n\n**寄存器**：并行/串行、移位寄存器\n\n## 五、脉冲电路与转换器\n\n**555 定时器**\n- 单稳态：**t_w ≈ 1.1RC**\n- 多谐振荡：**f ≈ 1.44 / [(R₁ + 2R₂)C]**\n- 施密特触发器：回差电压\n\n**A/D 与 D/A**\n- 分辨率：满量程 / 2ⁿ（n 为位数）\n- **采样定理**：f_s ≥ 2f_max\n- 转换时间、量化误差\n\n---\n\n# 第四部分 电气工程基础（你的主场）\n\n## 一、变压器\n\n- 变比：**k = N₁/N₂ = U₁/U₂**\n- 等效电路：励磁支路 + 漏抗 + 绕组电阻\n- **空载试验**：求励磁参数 R_m、X_m（低压侧加额定电压）\n- **短路试验**：求短路参数 R_k、X_k（高压侧加低电压使电流达额定）\n- 电压调整率：ΔU% = (U₂₀ − U₂)/U₂₀ × 100%\n- 效率：η = P₂/P₁，最大效率发生在**铜损 = 铁损**时\n- 三相变压器连接组：Yyn0、Yd11 等，**组别号看时钟法**\n- 并联运行条件：变比相同、连接组相同、短路阻抗标幺值相近、**容量比不超过 3:1**\n\n## 二、异步电动机\n\n- 同步转速：**n₁ = 60f/p**\n- 转差率：**s = (n₁ − n)/n₁**\n- 转子频率：f₂ = s·f₁\n- 转子电动势、电流随 s 变化\n- 电磁转矩：T = C_T·Φ·I₂′cosφ₂\n- **机械特性**：启动转矩、最大转矩（临界转差率 s_m = R₂′/X₂₀）\n- 启动方式：直接启动、Y-Δ 降压（启动电流降为 1/3）、自耦降压、软启动、变频\n- 调速：变极、变频、转子串阻（绕线式）\n\n## 三、同步电机\n- n₁ = 60f/p（**转速恒定，与负载无关**）\n- 功角特性：**P = (E₀U/X_d)·sin δ**\n- 励磁调节：过励（容性）、欠励（感性）\n- 同步调相机用于无功补偿\n- 并网条件：电压、频率、相位、相序一致（准同期）\n\n## 四、直流电机\n- 电动势：**E_a = C_e·Φ·n**\n- 电磁转矩：**T = C_t·Φ·I_a**\n- 机械特性：并励（硬特性）、串励（软特性）\n- 启动：必须串电阻限流\n- 调速：调压、调磁、串阻\n\n## 五、电力系统\n\n**标幺制**\n- X* = X / X_B，S_B、U_B、I_B、Z_B 四个基准\n- 基准关系：Z_B = U_B²/S_B，I_B = S_B/(√3U_B)\n\n**短路电流**\n- I″ = E″/X∑（标幺值）\n- 冲击电流：i_sh = √2·K_sh·I″（K_sh 一般 1.8—1.9）\n- 短路容量：S_k = √3·U·I″\n\n**中性点接地方式**\n\n| 方式 | 特点 | 适用 |\n|---|---|---|\n| 不接地 | 单相接地时线电压不变，可继续运行 2 小时 | 10—35 kV 小电流系统 |\n| 经消弧线圈接地 | 补偿电容电流 | 电容电流较大的中压系统 |\n| 直接接地 | 单相短路电流大，需快速切除 | 110 kV 及以上 |\n\n## 六、继电保护\n\n**三段式电流保护**\n1. **瞬时电流速断**（I 段）：保护本线路首端，无延时\n2. **限时电流速断**（II 段）：带 0.5 s 延时，保护全线\n3. **定时限过电流**（III 段）：后备保护\n\n其他：距离保护（阻抗）、差动保护（变压器、母线）、零序保护（接地故障）\n\n## 七、电气设备选择\n\n| 校验项 | 条件 |\n|---|---|\n| **热稳定** | I_t²·t ≥ I_∞²·t_k |\n| **动稳定** | i_es ≥ i_sh |\n| 额定电压 | U_N ≥ U_网 |\n| 额定电流 | I_N ≥ I_工作max |\n\n---\n\n## 八、磁路与铁心线圈（常考，别漏）\n\n- **磁路欧姆定律**：F = NI = Φ·R_m，磁阻 **R_m = l/(μS)**\n- 交流铁心线圈：**U ≈ 4.44·f·N·Φ_m**（忽略漏抗和绕组电阻）\n- 铁损 = **磁滞损耗 + 涡流损耗**，都随 f、B_m 增大\n- 直流线圈：I = U/R，与磁路无关；交流线圈：U 固定时 Φ_m 基本不变（\"恒磁通\"）\n\n## 九、电气主接线\n\n| 形式 | 特点 | 适用 |\n|---|---|---|\n| 单母线 | 简单、便宜、可靠性低 | 中小型 |\n| 单母线分段 | 一段检修不影响另一段 | 中大型 |\n| 双母线 | 可靠性高、可轮流检修、操作复杂 | 重要枢纽 |\n| 桥形（内桥/外桥） | 两进两出、省断路器 | 终端/穿越变电站 |\n| 单元接线 | 发电机—变压器直接相连 | 大机组 |\n\n- **隔离开关不能带负荷操作**，只用于隔离电源；断路器才能开断负荷电流和短路电流\n\n## 十、互感器与高压电器\n\n- **电流互感器（CT）二次侧严禁开路**：开路会产生危险高压\n- **电压互感器（PT）二次侧严禁短路**：短路会烧毁\n- CT 误差：比差、角差；准确级 0.2 / 0.5 / 10P 等\n- 断路器：能开断短路电流，灭弧介质有 SF6、真空\n- 隔离开关：无灭弧能力；负荷开关：可开断负荷电流，不能开断短路电流\n\n## 十一、防雷与接地\n\n- 避雷针（线）保护范围：折线法（或滚球法）\n- 避雷器：氧化锌避雷器（MOA）限制过电压\n- 接地电阻：大接地短路电流系统一般 ≤ 0.5 Ω，小电流系统一般 ≤ 4 Ω\n- **接触电压**是手与脚之间，**跨步电压**是两脚之间\n- 低压接地型式：TN（TN-S / TN-C）、TT、IT\n\n---\n\n## 十个高频陷阱\n\n1. **功率正负号**：关联参考方向下 p>0 是吸收，不是发出\n2. **叠加定理不能叠加功率**\n3. **含受控源的等效电阻**必须用外加电源法\n4. **换路定则只适用于 u_C 和 i_L**，其他量可以突变\n5. 串联谐振时**电流最大**，并联谐振时**阻抗最大**\n6. 理想变压器阻抗变换是 **k²**，不是 k\n7. 运放\"虚短虚断\"只在**负反馈**条件下成立，比较器里不成立\n8. **CMOS 输入端不能悬空**，TTL 可以\n9. 异步电机 Y-Δ 启动，启动电流和转矩都降为 **1/3**\n10. 标幺值换算基准变了要重算，**不能跨基准直接相加**\n\n---\n\n> 本文件是考点地图，不是教材。公式经核对，如与当年教材或现行规范有出入，以教材/规范为准。\n> 建议配套动作：每看完一个板块，立刻做该板块 10—15 道真题，错题记在旁边的空白处。","videos":[]},{"id":"math","title":"数学速查表","sub":"公共基础 20–24 分，单科最大一块","pills":[{"t":"20–24 分","k":"a"},{"t":"会就是会","k":""},{"t":"十个陷阱","k":""}],"md":"# 注册电气工程师 · 基础考试 数学速查表\n\n> 用途：配合教材和真题使用，**不要当教材读**。\n> 每章结构固定：考什么 → 用什么方法 → 公式 → 陷阱。\n> 用法：做题卡住时查表，查完立刻回去把那道题算完。查三次还没记住的，抄到一张白纸上。\n\n---\n\n## 〇、分值定位\n\n公共基础 120 分里，数学约占 **20—24 分**（单选，每题 1 分），是单科最大的一块。\n\n题型分布大致：极限 1—2 题、导数与微分 2—3 题、积分 2—3 题、多元函数 1—2 题、级数 1—2 题、微分方程 1—2 题、线性代数 2—3 题、概率 2—3 题。\n\n**数学是\"会就是会\"的科目**——不像法规要背，算对了就是分。对设计院出身的人，这是公共基础里性价比最高的一块。\n\n---\n\n## 一、空间解析几何（送分题，别丢）\n\n**向量**\n- 点积：a·b = a₁b₁ + a₂b₂ + a₃b₃ = |a||b|cosθ\n- 垂直：a·b = 0　平行：a × b = 0\n- 叉积模：|a × b| = |a||b|sinθ = 平行四边形面积\n\n**平面** Ax + By + Cz + D = 0，法向量 n = (A, B, C)\n**直线** 对称式：(x−x₀)/l = (y−y₀)/m = (z−z₀)/n，方向向量 (l, m, n)\n\n**点到平面距离**：d = |Ax₀ + By₀ + Cz₀ + D| / √(A² + B² + C²)\n\n**球面**：(x−a)² + (y−b)² + (z−c)² = R²\n**旋转曲面**：绕 z 轴旋转 → 把 x² 换成 x² + y²\n\n---\n\n## 二、极限\n\n### 等价无穷小（x → 0，只在**乘除**中直接替换）\n\n| 原式 | 等价于 |\n|---|---|\n| sin x, tan x, arcsin x, arctan x | x |\n| 1 − cos x | x²/2 |\n| ln(1 + x) | x |\n| eˣ − 1 | x |\n| aˣ − 1 | x·ln a |\n| (1 + x)^a − 1 | a·x |\n| x − sin x | x³/6 |\n| tan x − x | x³/3 |\n| x − ln(1 + x) | x²/2 |\n\n### 两个重要极限\n- lim(x→0) sin x / x = 1\n- lim(x→∞) (1 + 1/x)ˣ = e　　lim(x→0) (1 + x)^(1/x) = e\n\n### 七种未定式与解法\n\n| 型 | 首选方法 |\n|---|---|\n| 0/0、∞/∞ | 等价替换 → 洛必达 → 泰勒 |\n| 0·∞ | 化成 0/0 或 ∞/∞ |\n| ∞ − ∞ | 通分 / 有理化 / 提公因子 |\n| 1^∞ | 用 e^{lim (f−1)·g} |\n| 0⁰、∞⁰ | 取对数：lim g·ln f |\n\n**洛必达**：只对 0/0 和 ∞/∞ 有效，且要求导数之比的极限存在。\n\n**1^∞ 口诀**：底数减 1 乘指数，取 e 的极限。\n\n---\n\n## 三、导数与微分\n\n### 基本导数表\n\n| f(x) | f'(x) |\n|---|---|\n| x^a | a·x^(a−1) |\n| aˣ | aˣ·ln a |\n| eˣ | eˣ |\n| log_a x | 1/(x·ln a) |\n| ln x | 1/x |\n| sin x | cos x |\n| cos x | −sin x |\n| tan x | sec²x |\n| cot x | −csc²x |\n| sec x | sec x·tan x |\n| csc x | −csc x·cot x |\n| arcsin x | 1/√(1−x²) |\n| arccos x | −1/√(1−x²) |\n| arctan x | 1/(1+x²) |\n| arccot x | −1/(1+x²) |\n\n### 求导法则\n- 积：(uv)' = u'v + uv'\n- 商：(u/v)' = (u'v − uv')/v²\n- 复合：dy/dx = dy/du · du/dx\n- 隐函数 F(x,y) = 0：dy/dx = −F_x / F_y\n- 参数方程：dy/dx = (dy/dt)/(dx/dt)\n  - 二阶：d²y/dx² = [d/dt(dy/dx)] / (dx/dt)\n- 幂指函数 y = u^v：取对数再求导\n\n### 高阶导数常用\n- (eˣ)^(n) = eˣ\n- (sin x)^(n) = sin(x + nπ/2)\n- (cos x)^(n) = cos(x + nπ/2)\n- (xⁿ)^(n) = n!\n- (ln x)^(n) = (−1)^(n−1)·(n−1)!/xⁿ\n\n### 微分\ndy = f'(x)dx\n近似：f(x₀ + Δx) ≈ f(x₀) + f'(x₀)·Δx\n\n---\n\n## 四、中值定理与导数应用\n\n### 三大中值定理\n- **罗尔**：f 在 [a,b] 连续、(a,b) 可导、f(a) = f(b) ⟹ ∃ξ，f'(ξ) = 0\n- **拉格朗日**：f(b) − f(a) = f'(ξ)(b − a)\n- **柯西**：[f(b)−f(a)]/[g(b)−g(a)] = f'(ξ)/g'(ξ)\n\n### 泰勒展开（x → 0）\n\n| 函数 | 展开 |\n|---|---|\n| eˣ | 1 + x + x²/2! + x³/3! + … |\n| sin x | x − x³/3! + x⁵/5! − … |\n| cos x | 1 − x²/2! + x⁴/4! − … |\n| ln(1+x) | x − x²/2 + x³/3 − … |\n| (1+x)^a | 1 + ax + a(a−1)x²/2! + … |\n\n### 单调、极值、凹凸\n\n| 判据 | 结论 |\n|---|---|\n| f' > 0 | 单调增 |\n| f' < 0 | 单调减 |\n| f' = 0 且 f'' > 0 | 极小值 |\n| f' = 0 且 f'' < 0 | 极大值 |\n| f'' > 0 | 凹（下凸） |\n| f'' < 0 | 凸（上凸） |\n| f'' 变号 | 拐点 |\n\n### 渐近线\n- 水平：lim(x→∞) f(x) = b\n- 垂直：lim(x→a) f(x) = ∞，则 x = a\n- 斜：k = lim f(x)/x，b = lim [f(x) − kx]\n\n### 曲率\nK = |y''| / (1 + y'²)^(3/2)\n\n---\n\n## 五、不定积分\n\n### 基本积分表\n\n| ∫ | 结果 |\n|---|---|\n| x^a dx | x^(a+1)/(a+1) + C（a ≠ −1） |\n| dx/x | ln|x| + C |\n| eˣ dx | eˣ + C |\n| aˣ dx | aˣ/ln a + C |\n| sin x dx | −cos x + C |\n| cos x dx | sin x + C |\n| sec²x dx | tan x + C |\n| csc²x dx | −cot x + C |\n| sec x·tan x dx | sec x + C |\n| tan x dx | −ln|cos x| + C |\n| cot x dx | ln|sin x| + C |\n| sec x dx | ln|sec x + tan x| + C |\n| csc x dx | ln|csc x − cot x| + C |\n| dx/(1+x²) | arctan x + C |\n| dx/√(1−x²) | arcsin x + C |\n| dx/(a²+x²) | (1/a)arctan(x/a) + C |\n| dx/√(a²−x²) | arcsin(x/a) + C |\n| dx/(x²−a²) | (1/2a)·ln|(x−a)/(x+a)| + C |\n\n### 两种换元\n**第一类（凑微分）**：∫f(φ(x))φ'(x)dx = ∫f(u)du\n\n**第二类（三角代换）**\n- √(a² − x²) → x = a sin t\n- √(a² + x²) → x = a tan t\n- √(x² − a²) → x = a sec t\n\n### 分部积分\n∫u dv = uv − ∫v du\n\n**u 的选取顺序（口诀：反对幂指三）**：反三角 > 对数 > 幂函数 > 指数 > 三角。\n排在前面的作 u，后面的凑进 dv。\n\n---\n\n## 六、定积分\n\n### 牛顿-莱布尼茨\n∫ₐᵇ f(x)dx = F(b) − F(a)\n\n### 必记性质\n- 奇偶性：∫₋ₐᵃ 偶函数 = 2∫₀ᵃ；奇函数 = 0\n- 区间可加：∫ₐᵇ = ∫ₐᶜ + ∫꜀ᵇ\n- 变上限求导：d/dx ∫ₐ^φ(x) f(t)dt = f(φ(x))·φ'(x)\n\n### 应用公式\n| 求什么 | 公式 |\n|---|---|\n| 面积 | ∫ₐᵇ \\|f(x) − g(x)\\| dx |\n| 绕 x 轴旋转体体积 | V = π∫ₐᵇ f²(x)dx |\n| 绕 y 轴（柱壳法） | V = 2π∫ₐᵇ x·f(x)dx |\n| 弧长 | L = ∫ₐᵇ √(1 + y'²) dx |\n| 平均值 | [1/(b−a)]∫ₐᵇ f(x)dx |\n\n---\n\n## 七、多元函数\n\n### 偏导与全微分\ndz = z_x dx + z_y dy\n\n**复合函数**：z = f(x,y)，x = x(t)，y = y(t) ⟹ dz/dt = z_x·x' + z_y·y'\n\n**隐函数** F(x,y,z) = 0 ⟹ z_x = −F_x/F_z，z_y = −F_y/F_z\n\n**方向导数与梯度**\n- 梯度：grad f = (f_x, f_y, f_z)\n- 方向导数：∂f/∂l = grad f · e_l = f_x·cos α + f_y·cos β + f_z·cos γ\n- **梯度方向是函数增长最快的方向**，其模为最大变化率\n\n### 二元极值判别\n驻点处令 A = z_xx，B = z_xy，C = z_yy：\n\n| 条件 | 结论 |\n|---|---|\n| AC − B² > 0 且 A > 0 | 极小值 |\n| AC − B² > 0 且 A < 0 | 极大值 |\n| AC − B² < 0 | 非极值点 |\n| AC − B² = 0 | 失效，另判 |\n\n### 二重积分\n- 直角坐标：化为累次积分，注意积分次序（先积的看边界）\n- 极坐标：x = r cosθ，y = r sinθ，**dxdy = r dr dθ**（别漏 r）\n\n---\n\n## 八、级数\n\n### 正项级数判别\n| 方法 | 判据 |\n|---|---|\n| 比值 | lim a_{n+1}/a_n = ρ，ρ<1 收敛，ρ>1 发散 |\n| 根值 | lim ⁿ√a_n = ρ，同上 |\n| p 级数 | Σ1/n^p，p>1 收敛，p≤1 发散 |\n| 几何级数 | Σqⁿ，\\|q\\|<1 收敛 |\n\n### 交错级数\n**莱布尼茨判据**：a_n 单调递减且 lim a_n = 0 ⟹ 收敛。\n\n**绝对收敛**：Σ|a_n| 收敛；**条件收敛**：Σa_n 收敛但 Σ|a_n| 发散。\n\n### 幂级数\n收敛半径 R = lim |a_n / a_{n+1}|\n收敛区间 (−R, R)，**端点必须单独代入检验**。\n\n### 五个必背展开\n- eˣ = Σ xⁿ/n!\n- sin x = Σ (−1)ⁿ x^(2n+1)/(2n+1)!\n- cos x = Σ (−1)ⁿ x^(2n)/(2n)!\n- 1/(1−x) = Σ xⁿ（|x| < 1）\n- ln(1+x) = Σ (−1)^(n−1) xⁿ/n\n\n---\n\n## 九、微分方程\n\n### 可分离变量\ndy/dx = f(x)g(y) ⟹ ∫dy/g(y) = ∫f(x)dx\n\n### 一阶线性\ny' + P(x)y = Q(x)\n\n**通解**：y = e^(−∫P dx) · [ ∫Q·e^(∫P dx) dx + C ]\n\n### 齐次方程\ny' = f(y/x)，令 u = y/x，则 y = ux，y' = u + x·u'\n\n### 二阶常系数齐次\ny'' + py' + qy = 0，特征方程 r² + pr + q = 0\n\n| 特征根 | 通解 |\n|---|---|\n| 两个不等实根 r₁, r₂ | y = C₁e^(r₁x) + C₂e^(r₂x) |\n| 重根 r | y = (C₁ + C₂x)e^(rx) |\n| 共轭复根 α ± βi | y = e^(αx)(C₁cos βx + C₂sin βx) |\n\n### 二阶常系数非齐次\n\ny'' + py' + qy = f(x)，通解 = 齐次通解 + 一个特解 y*\n\n| f(x) 形式 | 特解设法 |\n|---|---|\n| P_m(x)·e^(λx) | y* = x^k·Q_m(x)·e^(λx)，k = λ 作为特征根的重数（0 / 1 / 2） |\n| e^(αx)[P_m(x)cos βx + P_n(x)sin βx] | y* = x^k·e^(αx)[R_l(x)cos βx + S_l(x)sin βx]，l = max(m,n)；α±iβ 是特征根则 k = 1，否则 k = 0 |\n\n> 记法：**指数照抄，多项式升一阶；λ 是根就乘 x，重根乘 x²**。\n\n---\n\n## 十、线性代数\n\n### 行列式性质\n- 行列互换，值不变\n- 交换两行（列），变号\n- 某行乘 k，行列式乘 k\n- 某行加上另一行的 k 倍，值不变\n- **n 阶：|kA| = kⁿ|A|**（最容易错）\n\n### 矩阵运算\n- (AB)ᵀ = BᵀAᵀ\n- (AB)⁻¹ = B⁻¹A⁻¹\n- **乘法不可交换**：AB ≠ BA\n- **AB = 0 推不出 A = 0 或 B = 0**\n\n### 秩\nr(AB) ≤ min(r(A), r(B))\n\n### 线性方程组 Ax = b\n| 条件 | 解的情况 |\n|---|---|\n| r(A) = r(A\\|b) = n | 唯一解 |\n| r(A) = r(A\\|b) < n | 无穷多解 |\n| r(A) < r(A\\|b) | 无解 |\n\n齐次方程组 Ax = 0 有非零解 ⟺ r(A) < n ⟺ |A| = 0\n\n### 特征值\n特征方程 |A − λI| = 0\n\n- **Σλᵢ = tr(A)**（主对角线之和）\n- **Πλᵢ = |A|**\n\n这两个性质能秒杀一大类选择题。\n\n---\n\n## 十一、概率论\n\n### 基本公式\n- 古典概型：P = 有利结果数 / 总结果数\n- 条件概率：P(A|B) = P(AB)/P(B)\n- 全概率：P(A) = Σ P(Bᵢ)P(A|Bᵢ)\n- 贝叶斯：P(Bᵢ|A) = P(Bᵢ)P(A|Bᵢ) / P(A)\n- 独立：P(AB) = P(A)P(B)\n\n### 常见分布\n\n| 分布 | 概率/密度 | 期望 | 方差 |\n|---|---|---|---|\n| 二项 B(n,p) | C(n,k)p^k(1−p)^(n−k) | np | np(1−p) |\n| 泊松 P(λ) | λ^k e^(−λ)/k! | λ | λ |\n| 均匀 U(a,b) | 1/(b−a) | (a+b)/2 | (b−a)²/12 |\n| 指数 E(λ) | λe^(−λx) | 1/λ | 1/λ² |\n| 正态 N(μ,σ²) | — | μ | σ² |\n\n正态标准化：Z = (X − μ)/σ\n\n### 期望方差性质\n- E(aX + b) = aE(X) + b\n- E(X + Y) = E(X) + E(Y)\n- D(aX + b) = a²D(X)\n- **D(X) = E(X²) − [E(X)]²**\n\n---\n\n## 十二、十个高频陷阱\n\n1. **洛必达只对 0/0 和 ∞/∞ 有效**，其他型先化形\n2. **等价无穷小只能在乘除中替换**，加减中直接换会错\n3. **1^∞ 不是 1**，是 e 的某个极限\n4. **可导必连续，连续不一定可导**（|x| 在 0 处）\n5. **极值点不一定 f' = 0**（可能是不可导点）\n6. **定积分换元必须换上下限**，别换完还用原来的限\n7. **幂级数端点要单独判**，R 只保证开区间\n8. **矩阵乘法不交换**，且 AB = 0 不推出 A 或 B 为零\n9. **|kA| = kⁿ|A|**，n 是阶数，别漏次方\n10. **独立 ≠ 互斥**。互斥是 P(AB) = 0，独立是 P(AB) = P(A)P(B)，两者只在特殊情况下同时成立\n\n---\n\n## 附：使用建议\n\n1. **第一遍**：跟着教材走，遇到公式就查这张表，不要另找资料\n2. **第二遍**：只做真题，错一题就在表上把对应公式圈一下\n3. **考前**：只看被圈过的部分——通常不超过全表的 1/3\n4. 表上的公式如果自己推不出来，说明是真没掌握，回去看教材推导，别硬背\n\n> 本表覆盖基础考试数学大纲的常考内容，但不替代教材的系统讲解。公式经核对，如与当年教材有出入，以教材为准。","videos":[{"title":"空间解析几何 · 短课 01","sub":"41 秒 · 一个点为什么要三个数（含题记）","poster":"/9j/4AAQSkZJRgABAgAAAQABAAD//gAQTGF2YzYyLjI4LjEwMAD/2wBDAAgICAkICQsLCwsLCw0MDQ0NDQ0NDQ0NDQ0ODg4REREODg4NDQ4OEBARERITEhERERETExQUFBgYFxccHB0iIin/xACVAAEBAQADAQEAAAAAAAAAAAAAAQIDBgUEBwEBAQEBAAAAAAAAAAAAAAAAAAECAxABAAIBAgMEBggEBAIIBwEAAAECAxEEBRIhMUEGE1EiYXFikcGCMkMUQpKBI1IHFbGhcjNjJDbRoqOyszQW4fAmc8PxdVQRAQEBAAMAAgIDAQAAAAAAAAABESECEjFRIkGh4WGB/8AAEQgCHAPAAwEiAAIRAAMRAP/aAAwDAQACEQMRAD8A/ClBpkAAAAAAAAAAAUAABQAAAAAFEQUBFAAAAAAUBBQEUAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQUBBQEAAAAABBQEFQAAUABBQEFQABAAAAAAAAUAUEUAAAABAUAAAAAAAFARQAAAAAAAAAAAAAAAAAAAAAAAFAQUBBQEFAQUBBQEFFEFAQUBBRBBQEFARyzi0iJ5uk15tdPbpo43La2lIpE6xrze7p2dQcIoCCgIKgAAAAAAAAAAAAAAAAAAAAAAIKAgqAAAAAgoCCoAAKgCAAAAoAoIoAAAAoiKAAAAAAoCKAAAAAAAAAAAAAAAAAAoCCgIoAAKAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPp0jy+TTrr/wBrTXT5dEtHzAKAAAAAAAACKIIKAgoCAAAAAAAAAAAAAAAAAAgoCCoAAAigMgCgKCKAAAAKIigAAAAAKAAAAAAAAAAAAAAAAoIKAigAAoAAAAAAAoIKAgoCCgAAAAAAAAAAAAAAAAAAAAAADf5PrfQw3939b6AYAARQEFAQUBBUAAAAAAAAAAQQUBBUAAAAAAAAAAAAAAARQEFQGVAUAAAEFAAAAAAUAAAAAAAAAAAAAAAFAAAAFAAAAA |---|\n| 柔索（绳、带） | 沿索，背离物体（拉力） |\n| 光滑接触面 | 沿接触面法线，指向物体 |\n| 固定铰支座 | 两个正交分力 |\n| 可动铰支座（辊轴） | 垂直于支承面 |\n| 固定端 | 两个正交分力 + 一个约束力偶 |\n| 二力杆 | 沿两铰连线，拉或压 |\n\n#### 平面力系平衡方程\n\n**一般式**（三个独立方程）：\n- ΣFₓ = 0\n- ΣFᵧ = 0\n- ΣM_A = 0\n\n**二力矩式**：ΣM_A = 0，ΣM_B = 0，ΣFₓ = 0（A、B 连线不垂直于 x 轴）\n**三力矩式**：ΣM_A = ΣM_B = ΣM_C = 0（三点不共线）\n\n> 独立方程数 = 3。多于 3 个未知力的结构叫**超静定**，基础考试一般不深究。\n\n#### 空间力系与重心\n- 空间一般力系平衡：ΣF_x = ΣF_y = ΣF_z = 0，ΣM_x = ΣM_y = ΣM_z = 0（6 个方程）\n- 重心：x_C = Σ(G_i·x_i)/ΣG_i；均质物体用体积或面积代替重量\n\n#### 摩擦\n- 最大静摩擦力：F_max = f·N\n- **摩擦角**：tan φ = f\n- **自锁**：当主动力合力作用线落在摩擦角范围内，无论力多大都推不动\n\n---\n\n### 二、运动学\n\n#### 点的运动（直角坐标）\n- 速度：vₓ = dx/dt，vᵧ = dy/dt\n- 加速度：aₓ = d²x/dt²，aᵧ = d²y/dt²\n\n#### 点的运动（自然坐标）\n- 速度：v = ds/dt\n- **切向加速度**：a_τ = dv/dt（改变速度大小）\n- **法向加速度**：a_n = v²/ρ（改变方向，ρ 为曲率半径）\n- 全加速度：a = √(a_τ² + a_n²)\n\n#### 点的合成运动（重点）\n\n**速度合成**：v_a = v_e + v_r\n- 绝对速度 = 牵连速度 + 相对速度\n\n**加速度合成**：a_a = a_e + a_r + a_c\n- **科氏加速度**：a_c = 2ω × v_r\n- 大小：a_c = 2ω·v_r·sinθ（v_r 垂直于 ω 时取 2ωv_r）\n- **方向**：把 v_r 沿 ω 方向转 90°\n\n> 判断有没有科氏加速度：动系在转动 + 相对速度不为零且不平行于转轴。\n\n#### 刚体基本运动\n\n**平动**：各点轨迹相同，v、a 相同\n\n**定轴转动**：\n- 角速度 ω = dφ/dt，角加速度 ε = dω/dt\n- 线速度 v = ω·r\n- 切向加速度 a_τ = ε·r\n- 法向加速度 a_n = ω²·r\n\n#### 刚体平面运动\n\n**基点法**：v_B = v_A + v_BA\n- v_BA = ω·AB，方向垂直于 AB\n\n**速度瞬心法**（做题优先用）：\n- v = ω·r（r 为点到瞬心的距离）\n- 找瞬心：两点速度方向已知 → 作垂线交点；两速度平行且不等 → 连线与速度矢端连线相交\n\n---\n\n### 三、动力学\n\n#### 三大定理（做题先判断用哪个）\n\n| 题目特征 | 用哪个定理 |\n|---|---|\n| 求力、加速度，涉及时间 | 动量定理 / 质心运动定理 |\n| 涉及转动、求角加速度 | 动量矩定理 |\n| 涉及位移、速度，不涉及时间 | **动能定理**（最常用） |\n\n#### 基本公式\n\n**牛顿第二定律**：F = ma\n\n**动量定理**：\n- d(mv)/dt = F\n- 冲量 = 动量变化：∫F dt = mv₂ − mv₁\n\n**质心运动定理**：ΣF = M·a_c\n\n**动量矩定理**：\n- dL/dt = M\n- 定轴转动：**J·ε = M**（J 为转动惯量）\n\n**转动惯量**\n- 均质圆盘（绕中心轴）：J = ½mR²\n- 均质细杆（绕端点）：J = ⅓ml²\n- 均质细杆（绕中点）：J = 1/12·ml²\n- **平行轴定理**：J = J_c + m·d²\n\n**动能定理**：W = ΔT\n\n| 运动形式 | 动能 |\n|---|---|\n| 平动 | T = ½mv² |\n| 定轴转动 | T = ½Jω² |\n| 平面运动 | T = ½mv_c² + ½J_cω² |\n\n**达朗贝尔原理**：加惯性力 F_I = −ma，惯性力偶 M_I = −Jε，把动力学问题变成静力学平衡问题。\n\n---\n\n## 第二部分 材料力学\n\n### 〇、四种基本变形的对应关系\n\n| 变形 | 内力 | 应力公式 | 变形公式 |\n|---|---|---|---|\n| 拉压 | 轴力 N | σ = N/A | Δl = Nl/(EA) |\n| 剪切 | 剪力 Q | τ = Q/A | — |\n| 扭转 | 扭矩 T | τ = T·ρ/Ip | φ = Tl/(GIp) |\n| 弯曲 | 弯矩 M | σ = M·y/Iz | 挠曲线 EI·y'' = M |\n\n**记住这张表，材料力学一半的分就在这。**\n\n---\n\n### 一、基本概念\n\n- **内力**：截面法求，用平衡方程\n- **应力**：正应力 σ（垂直截面）、切应力 τ（平行截面）\n- **应变**：ε = Δl/l\n- **胡克定律**：σ = Eε（E 为弹性模量）\n- **泊松比**：ν = −ε′/ε（横向应变与纵向应变之比，取正值）\n\n---\n\n### 二、轴向拉伸与压缩\n\n- 正应力：σ = N/A\n- 变形：Δl = Nl/(EA)，其中 EA 叫**抗拉刚度**\n- 强度条件：σ_max = N/A ≤ [σ]\n\n**三类问题**：强度校核、截面设计、许可载荷\n\n**超静定**：未知力多于平衡方程时，补充**变形协调方程**（各段变形之和 = 总变形）。\n\n**温度应力**：Δl_t = α·l·ΔT，若两端固定则产生压应力 σ = E·α·ΔT\n\n---\n\n### 三、剪切与挤压\n\n- 剪切应力：τ = Q/A_s（A_s 为剪切面面积）\n- 挤压应力：σ_bs = F/A_bs（A_bs 为挤压面**投影**面积）\n\n> 常见于铆钉、螺栓、键连接。判断剪切面：沿被剪断的方向找。\n\n---\n\n### 四、扭转\n\n**圆轴扭转**（只考圆截面）\n\n- 切应力：τ = T·ρ/Ip（ρ 为到圆心距离）\n- 最大切应力：**τ_max = T/Wp**\n\n**截面几何性质**\n\n| 截面 | 极惯性矩 Ip | 抗扭截面系数 Wp |\n|---|---|---|\n| 实心圆（直径 d） | πd⁴/32 | πd³/16 |\n| 空心圆（外 D 内 d，α = d/D） | πD⁴(1−α⁴)/32 | πD³(1−α⁴)/16 |\n\n- 扭转角：φ = Tl/(GIp)，GIp 叫**抗扭刚度**\n- 单位长度扭转角：θ = T/(GIp)\n- 强度条件：τ_max ≤ [τ]；刚度条件：θ ≤ [θ]\n\n---\n\n### 五、弯曲（分值最高）\n\n#### 内力图\n- **剪力 Q 图**：集中力处突变，力偶处不变\n- **弯矩 M 图**：集中力处转折，力偶处突变\n- 关系：**dM/dx = Q**（Q = 0 处 M 取极值）\n\n> 画图口诀：Q 图看面积，M 图看斜率；均布载荷下 Q 是斜线、M 是抛物线。\n\n#### 正应力\n- **σ = M·y/Iz**\n- **σ_max = M/Wz**\n\n#### 截面几何性质\n\n| 截面 | 惯性矩 Iz | 抗弯截面系数 Wz |\n|---|---|---|\n| 矩形 b×h | bh³/12 | bh²/6 |\n| 圆形 d | πd⁴/64 | πd³/32 |\n| 圆环 | πD⁴(1−α⁴)/64 | πD³(1−α⁴)/32 |\n\n**平行轴定理**：I_z = I_zc + A·a²（a 为两轴距离）\n\n#### 切应力\nτ = Q·S/(Iz·b)\n\n矩形截面最大切应力在中性轴：**τ_max = 3Q/(2A)**\n\n#### 挠度\n挠曲线微分方程：**EI·y'' = M**\n\n常见结果（背下来能省时间）：\n- 简支梁受集中力 P（跨中）：y_max = Pl³/(48EI)\n- 简支梁受均布载荷 q：y_max = 5ql⁴/(384EI)\n- 悬臂梁端部受集中力 P：y_max = Pl³/(3EI)\n\n---\n\n### 六、应力状态与强度理论\n\n#### 主应力\n- 主平面上切应力为零，只有正应力\n- 主应力排序：**σ₁ ≥ σ₂ ≥ σ₃**\n\n**任意斜截面（α 自 x 轴逆时针量）**\n- σ_α = (σ_x + σ_y)/2 + (σ_x − σ_y)/2·cos 2α − τ_xy·sin 2α\n- τ_α = (σ_x − σ_y)/2·sin 2α + τ_xy·cos 2α\n- 主应力：σ_max,min = (σ_x + σ_y)/2 ± √{[(σ_x − σ_y)/2]² + τ_xy²}\n\n#### 偏心压缩与截面核心\n- 偏心压力 F（偏心距 e）：σ = −F/A ± M/W，M = F·e\n- 截面核心：压力作用点落在该区域内时，全截面不出现拉应力（混凝土等脆性材料必须满足）\n\n#### 四大强度理论\n\n| 理论 | 名称 | 相当应力 |\n|---|---|---|\n| 第一 | 最大拉应力 | σ_r1 = σ₁ |\n| 第二 | 最大伸长线应变 | σ_r2 = σ₁ − ν(σ₂ + σ₃) |\n| 第三 | 最大切应力 | **σ_r3 = σ₁ − σ₃** |\n| 第四 | 畸变能 | **σ_r4 = √{½[(σ₁−σ₂)² + (σ₂−σ₃)² + (σ₃−σ₁)²]}** |\n\n**选哪个**：脆性材料用第一/第二；塑性材料用第三/第四。**钢材（含电气设备结构件）用第三或第四。**\n\n---\n\n### 七、组合变形\n\n| 组合 | 相当应力 |\n|---|---|\n| 拉（压）+ 弯 | σ = N/A ± M/W（注意正负号叠加） |\n| 弯 + 扭（圆轴） | 第三理论：**σ_r3 = √(σ² + 4τ²)**<br>第四理论：**σ_r4 = √(σ² + 3τ²)** |\n\n> 弯扭组合是选择题高频，公式必须背到条件反射。\n\n---\n\n### 八、压杆稳定\n\n**欧拉公式**：P_cr = π²EI/(μl)²\n\n**临界应力**：σ_cr = π²E/λ²\n\n**长细比**：λ = μl/i，其中 i = √(I/A) 为惯性半径\n\n**长度系数 μ**\n\n| 支承情况 | μ |\n|---|---|\n| 两端铰支 | 1.0 |\n| 一端固定、一端自由 | 2.0 |\n| 两端固定 | 0.5 |\n| 一端固定、一端铰支 | 0.7 |\n\n**适用范围**：欧拉公式只适用于**大柔度杆**（λ ≥ λ_p）。中柔度杆用经验公式 σ_cr = a − bλ。\n\n**提高稳定性的措施**（常考简答式选择）：\n1. 减小压杆长度（最有效）\n2. 加强约束（减小 μ）\n3. 选择合理截面（增大 I，材料远离中性轴）\n4. 选用高强度材料（对细长杆**无效**——欧拉公式里只有 E，没有强度）\n\n---\n\n## 九、动载荷与疲劳\n\n**动荷系数法**：σ_d = K_d·σ_st，Δ_d = K_d·Δ_st\n\n| 情况 | K_d |\n|---|---|\n| 突然加载 | 2 |\n| 自由落体冲击（下落高度 h） | 1 + √(1 + 2h/Δ_st) |\n| 水平冲击（速度 v） | √(v²/(g·Δ_st)) |\n\n- 冲击问题用能量法：冲击前动能/势能 = 冲击后系统变形能\n- **交变应力**：循环特征 r = σ_min/σ_max；对称循环 r = −1，脉动循环 r = 0\n- 持久极限 σ₋₁：对称循环下的疲劳极限，**远低于强度极限**\n- 应力集中、表面粗糙度、尺寸效应都会降低疲劳强度\n\n---\n\n## 十、十个高频陷阱\n\n1. **力偶矩与矩心无关**，力矩与矩心有关——两者别混\n2. **科氏加速度**方向：v_r 沿 ω 转向转 90°，转反了大题全错\n3. **瞬心法**求的是速度，**不能**直接求加速度\n4. **动能定理不涉及时间**，求时间要用动量定理\n5. 转动惯量**平行轴定理**：J = J_c + md²，别忘 md² 项\n6. **抗弯截面系数 Wz = Iz / (h/2)**，不是 Iz\n7. **dM/dx = Q**，Q 为零处 M 才有极值——画图靠这个\n8. 弯扭组合：第三理论系数是 **4**，第四是 **3**，别记反\n9. **欧拉公式与材料强度无关**，只与 E、I、长度有关\n10. 空心圆抗扭/抗弯公式里的 **(1 − α⁴)**，α 是内外径之比，别用错\n\n---\n\n## 附：做题顺序建议\n\n1. **静力学先拿满**：受力分析 + 三个平衡方程，这是最稳的分\n2. **材料力学其次**：四张公式表（拉压、剪、扭、弯）背熟，能覆盖大部分题\n3. **运动学第三**：重点练速度合成和瞬心法，加速度合成只求会套公式\n4. **动力学最后**：优先练动能定理，动量矩定理只练定轴转动\n\n> 公式经核对，如与当年教材有出入以教材为准。各符号定义（如 μ、λ_p）以所用教材为准。","videos":[]},{"id":"electrical","title":"电工电子 · 工程经济 · 小科目","sub":"送分项、套路题，以及只求眼熟的记忆型小科","pills":[{"t":"12 分 送分","k":"a"},{"t":"经济 8 分","k":""},{"t":"小科 30 分","k":""}],"md":"# 注册电气工程师 · 基础考试 电工电子 + 工程经济 + 小科目速查\n\n> 电工电子约 12 分（你的送分项）、工程经济约 8 分（套路最固定）、其余小科目合计约 52 分（记忆型：物理 12、化学 10、流体 8、信号 6、计算机 10、法规 6）。\n> 前三块值得认真投入，小科目只求眼熟。\n\n---\n\n# 第一部分 电工电子技术\n\n## 〇、定位\n\n**你唯一可能失分的不是知识，是遗忘。** 这部分对电气专业是本科内容，建议直接拿真题定位，哪块错补哪块，不要从第一章看起。\n\n---\n\n## 一、直流电路\n\n### 基本定律\n- 欧姆定律：U = IR\n- **KCL**：任一节点，ΣI = 0（流入 = 流出）\n- **KVL**：任一回路，ΣU = 0\n\n### 串并联\n- 串联：R = R₁ + R₂ + …，电流相同，电压分配\n- 并联：1/R = 1/R₁ + 1/R₂ + …，电压相同，电流分配\n\n### 三大定理\n\n| 定理 | 内容 | 用法 |\n|---|---|---|\n| 叠加定理 | 多个电源分别作用，结果相加 | 只适用于线性电路，**功率不能叠加** |\n| 戴维南 | 二端网络等效为 U_oc 串联 R_eq | 求某一支路电流最快 |\n| 诺顿 | 等效为 I_sc 并联 R_eq | 与戴维南互为转换 |\n\n**最大功率传输**：负载 R_L = R_eq 时，P_max = U_oc² / (4R_eq)\n\n---\n\n## 二、正弦交流电路\n\n### 基本量\n- 有效值：U = U_m / √2\n- 角频率：ω = 2πf\n- 相量：U̇ = U∠φ\n\n### 阻抗\n- Z = R + j(X_L − X_C)\n- 感抗：X_L = ωL\n- 容抗：X_C = 1/(ωC)\n- 模：|Z| = √(R² + (X_L − X_C)²)\n- 阻抗角：tan φ = (X_L − X_C)/R\n\n### 功率（必考）\n\n| 名称 | 公式 | 单位 |\n|---|---|---|\n| 有功功率 | P = UI cos φ | W |\n| 无功功率 | Q = UI sin φ | var |\n| 视在功率 | S = UI | VA |\n| 关系 | S² = P² + Q² | — |\n\n### 串联谐振（重点）\n- 条件：X_L = X_C，即 **ω₀ = 1/√(LC)**\n- 谐振时：Z = R（最小），电流最大，**电压与电流同相**\n- 品质因数：Q = ω₀L/R = 1/(ω₀CR)\n\n### 功率因数提高\n并联电容补偿：**C = P(tan φ₁ − tan φ₂) / (ωU²)**\n- φ₁：补偿前功率因数角；φ₂：补偿后目标角\n- 并联电容**不改变有功功率**，只减少无功\n\n### 三相电路\n\n| 接法 | 线电压与相电压 | 线电流与相电流 |\n|---|---|---|\n| 星形（Y） | U_L = √3 U_P | I_L = I_P |\n| 三角形（Δ） | U_L = U_P | I_L = √3 I_P |\n\n三相功率：P = √3 U_L I_L cos φ\n\n---\n\n## 三、一阶暂态电路\n\n**时间常数**\n- RC 电路：τ = RC\n- RL 电路：τ = L/R\n\n**三要素法**（记这一个就够）：\n> f(t) = f(∞) + [f(0₊) − f(∞)]·e^(−t/τ)\n\n三个要素：初始值 f(0₊)、稳态值 f(∞)、时间常数 τ。\n\n---\n\n## 四、模拟电子\n\n### 二极管\n- 硅管正向导通压降约 **0.7 V**\n- 反向截止（理想视为断路）\n- 稳压管工作在**反向击穿区**\n\n### 三极管\n- 放大区：**I_C = βI_B**，I_E = (1+β)I_B\n- 三个工作区：截止、放大、饱和\n- 判断饱和：U_CE ≈ 0.3 V 且 I_C < βI_B\n\n### 共射放大电路\n\n**静态工作点**\n- I_B = (V_CC − U_BE)/R_B\n- I_C = βI_B\n- U_CE = V_CC − I_C·R_C\n\n**动态参数**\n- r_be = r_bb' + (1+β)·26mV/I_E\n- 电压放大倍数：**A_u = −β·R_L′/r_be**（负号表示反相）\n- 输入电阻 ≈ R_B ∥ r_be\n- 输出电阻 ≈ R_C\n\n### 理想运放（虚短虚断）\n\n| 电路 | 输出 |\n|---|---|\n| 反相比例 | u_o = −(R_f/R₁)·u_i |\n| 同相比例 | u_o = (1 + R_f/R₁)·u_i |\n| 加法（反相） | u_o = −R_f·(u₁/R₁ + u₂/R₂) |\n| 减法 | u_o = (R_f/R₁)(u₂ − u₁)（当 R₁=R₂, R₃=R_f） |\n| 积分 | u_o = −(1/R₁C)∫u_i dt |\n| 微分 | u_o = −R₁C·du_i/dt |\n\n> **虚短**：u₊ = u₋；**虚断**：i₊ = i₋ = 0。这两条能推出上面所有公式。\n\n---\n\n## 五、数字电子\n\n### 逻辑代数\n- 德摩根：**A + B 的非 = A非 · B非**；**AB 的非 = A非 + B非**\n- 常用化简：A + A非B = A + B\n\n### 数制\n- 二进制、八进制、十六进制互转\n- BCD 码：每 4 位二进制表示 1 位十进制\n\n### 组合逻辑\n- 编码器、译码器、数据选择器、加法器\n- **卡诺图化简**：圈 1，圈尽可能大，圈数尽可能少\n\n### 时序逻辑\n\n| 触发器 | 特性 |\n|---|---|\n| RS | 不允许 R = S = 1 |\n| JK | J = K = 1 时翻转 |\n| **D** | Q(n+1) = D（最常用） |\n| T | T = 1 时翻转 |\n\n- 计数器：模 N 计数，用反馈清零法或置数法实现任意模\n- 寄存器：并行/串行输入输出\n\n---\n\n# 第二部分 工程经济\n\n## 〇、定位\n\n**约 8 分，全是套路题。** 六个复利公式 + 四五个评价指标，背下来就是白送的分。这是公共基础里投入产出比最高的一块（比数学还高）。\n\n---\n\n## 一、六个复利公式（必须默写）\n\n记：P 现值、F 终值、A 年金、i 利率、n 期数\n\n| 求 | 已知 | 公式 |\n|---|---|---|\n| 终值 | P | **F = P(1+i)ⁿ** |\n| 现值 | F | **P = F(1+i)^(−n)** |\n| 终值 | A | **F = A[(1+i)ⁿ − 1]/i** |\n| 现值 | A | **P = A[(1+i)ⁿ − 1]/[i(1+i)ⁿ]** |\n| 年金 | P | **A = P·i(1+i)ⁿ/[(1+i)ⁿ − 1]** |\n| 年金 | F | **A = F·i/[(1+i)ⁿ − 1]** |\n\n**记忆锚点**：只有 (1+i)ⁿ 这一个因子在变，其余都是它的组合。\n\n## 二、名义利率与实际利率\n\n- 名义利率 r，每年计息 m 次\n- **实际利率 i = (1 + r/m)^m − 1**\n- 连续复利：i = e^r − 1\n\n---\n\n## 三、评价指标\n\n| 指标 | 公式/含义 | 判据 |\n|---|---|---|\n| 静态投资回收期 | 累计净现金流由负转正的时点 | 越短越好，≤ 基准值可行 |\n| 净现值 NPV | Σ(CI − CO)_t·(1+i)^(−t) | **NPV ≥ 0 可行** |\n| 净年值 NAV | NPV 摊到每年 | ≥ 0 可行 |\n| **内部收益率 IRR** | 使 **NPV = 0** 的折现率 | **IRR ≥ 基准收益率 可行** |\n| 净现值率 | NPV / 投资现值 | 用于多方案比选 |\n\n> **IRR 的经济含义**：项目本身能达到的最高收益率。计算靠试算 + 插值，考试一般给表。\n\n## 四、不确定性分析\n\n**盈亏平衡**（量本利分析）：\n- 保本产量：**Q* = F / (P − V − T)**\n  - F 固定成本、P 单价、V 单位变动成本、T 单位税金\n- 保本销售额：B* = P·Q*\n\n**敏感性分析**：找对指标影响最大的因素，通常用敏感度系数。\n\n## 五、价值工程\n\n**V = F / C**（价值 = 功能 / 成本）\n\n提高价值的五条途径：\n1. 功能↑ 成本↓（最理想）\n2. 功能↑ 成本不变\n3. 功能不变 成本↓\n4. 功能大幅↑ 成本小幅↑\n5. 功能小幅↓ 成本大幅↓\n\n## 六、设备更新\n\n- **经济寿命**：年均总成本最低的使用年限\n- 沉没成本不参与决策\n- 设备更新决策用**费用年值法**比较\n\n## 七、折旧与方案比选\n- 直线折旧：(原值 − 残值) / 折旧年限\n- 双倍余额递减：年折旧率 = 2/折旧年限，最后两年改直线\n- 互斥方案比选：**差额内部收益率** ΔIRR ≥ 基准收益率时取投资大的方案；也可用费用年值最小\n- 资金等值：不同时点的金额必须先折到同一时点才能比较\n\n---\n\n# 第三部分 小科目速览（只求眼熟）\n\n这几科合计约 52 分，特点是一半靠常识、一半靠考前突击。**不要提前背，放在考前两周集中处理。**\n\n## 物理（约 12 分）\n- 热学：理想气体状态方程 pV = nRT、热力学第一定律 ΔU = Q − W、熵增\n- 波动：波长频率关系 v = λf、干涉、驻波、多普勒效应\n- 光学：折射定律、全反射临界角 sin C = n₂/n₁、双缝干涉 Δx = λD/d\n- 振动：简谐振动 x = A·cos(ωt + φ)，T = 2π/ω；单摆 T = 2π√(l/g)\n- 近代：光电效应 hν = W + E_k，红限频率 ν₀ = W/h；德布罗意波长 λ = h/p\n- **拿分策略**：公式少，靠理解。热学和波动是主力。\n\n## 化学（约 10 分）\n- 物质结构：原子轨道、周期律、化学键\n- 溶液：浓度换算、稀溶液依数性\n- 电化学：原电池、电解、能斯特方程\n- 有机：官能团、同分异构\n- 化学平衡：平衡常数 K 只与温度有关；勒夏特列原理\n- 溶度积 K_sp 与溶解度的换算\n- 电极电势：能斯特方程 E = E° + (0.0592/n)·lg(氧化型/还原型)\n- **拿分策略**：纯记忆，考前突击最划算。重点背周期律和电化学。\n\n## 流体力学（约 8 分）\n- 静水压强：p = p₀ + ρgh\n- **连续性方程**：A₁v₁ = A₂v₂\n- **伯努利方程**：p₁/ρg + v₁²/2g + z₁ = p₂/ρg + v₂²/2g + z₂ + h_w\n- 雷诺数：Re = ρvd/μ = vd/ν，Re < 2000 层流，Re > 4000 湍流\n- 沿程损失：达西公式 h_f = λ(l/d)(v²/2g)\n- 局部损失：h_j = ζ·v²/(2g)；管路串联流量相同，并联水头损失相同\n- 孔口出流：v = √(2gH)，Q = μA√(2gH)\n- **拿分策略**：伯努利方程 + 连续性方程能覆盖一半题。\n\n## 信号与信息技术（约 6 分）\n- 信号分类：连续/离散、周期/非周期\n- 傅里叶变换的物理意义：时域 ↔ 频域；周期信号可分解为各次谐波\n- **采样定理**：f_s ≥ 2f_max\n- 香农公式：C = B·log₂(1 + S/N)\n- **拿分策略**：分最少、最难，**战略放弃**。会就做，不会就蒙。\n\n## 计算机应用基础（10 分，白给的分，别放弃）\n- 系统组成：CPU（运算器 + 控制器）、存储器、输入/输出、总线\n- 数制与编码：二/八/十/十六进制互转、ASCII、汉字编码、BCD 码\n- 操作系统：进程与线程、存储管理、文件系统、死锁\n- 网络：OSI 七层 / TCP-IP 四层、IP 地址与子网掩码、DNS、HTTP\n- 数据结构：栈、队列、树、排序算法复杂度（冒泡 O(n²)、快排平均 O(n log n)）\n- 软件工程：生命周期、结构化方法、测试（白盒 / 黑盒）\n- **拿分策略**：进制转换 + 网络 + 操作系统概念，考前一周能拿 6—8 分。\n\n## 法律法规（约 6 分）\n- 建筑法、招标投标法、合同法、安全生产法、建设工程质量管理条例\n- 招标投标法：必须招标的范围（大型基础设施 / 公用事业、国有资金项目）；中标通知书发出后 **30 日**内签合同\n- 质量管理条例保修期：电气管线、给排水管道、设备安装 **2 年**；屋面防水 5 年；供热供冷 2 个采暖期 / 供冷期\n- **拿分策略**：考前两周通读一遍，重点记**数字**（天数、金额、比例）。\n\n---\n\n## 附：这四科的复习顺序\n\n1. **工程经济**（8 分，套路最固定，2 天能拿下大半）\n2. **电工电子**（12 分，你的本行，只做题不看书）\n3. **物理 + 流体**（20 分，公式少、能理解）\n4. **化学 + 法规 + 计算机**（26 分，考前两周突击）\n5. **信号**（6 分，放弃）\n\n> 公式经核对，如与当年教材有出入以教材为准。工程经济的符号约定（CI、CO 等）以教材为准。","videos":[]},{"id":"resources","title":"资料清单","sub":"买三样就够，其余是生意不是备考","pills":[{"t":"三件套","k":"a"},{"t":"别买清单","k":""}],"md":"# 注册电气工程师 · 基础考试 资料清单\n\n> 制定日期：2026-11-04　适用：电力院 / 电气本专业 / 2027 年考基础\n\n---\n\n## 一、先说结论\n\n**基础考试不需要一堆资料。三样东西就够：**\n\n1. 一本复习教程（上下册）\n2. 一本历年真题\n3. 一个合规计算器\n\n其余全是锦上添花。培训机构和电商会把\"资料\"做成 20 件套，那是生意，不是备考。\n\n---\n\n## 二、必须买（三件）\n\n### ① 复习教程\n\n- **搜索关键词**：`注册电气工程师 基础考试 复习教程`\n- **主流出版社**：中国电力出版社（约占市场主流，购买页核对一下）\n- **规格**：分上、下两册，上册偏公共基础、下册偏专业基础（以实物目录为准）\n- **版次**：**每年更新，买最新年份的**。别买二手旧版，公式和考纲会有出入\n- **价格区间**：约 150—250 元（上下册合计，以在售页为准）\n- **在哪买**：京东自营 / 当当自营 / 中国电力出版社官方旗舰店\n\n> ⚠️ 我只给搜索关键词，不给具体 ISBN 和版次——这两个每年变，我无法在线核实，写错了你反而买错。用关键词搜，认\"最新年份 + 官方旗舰店/自营\"即可。\n\n### ② 历年真题\n\n- **搜索关键词**：`注册电气工程师 基础考试 历年真题`\n- **为什么必须有**：基础考试题型十几年没大变，考点重复率高。**真题的价值 > 任何模拟题**\n- **买哪几年的**：优先 2012 年之后的卷子（更贴近现行大纲），最近 3 年必须做三遍\n- **价格区间**：约 40—80 元\n- **买几本**：一本就够，别买\"XX 套密卷\"\n\n### ③ 计算器\n\n- **型号参考**：卡西欧 fx-991 系列（fx-991CN X 等）\n- **硬性要求**：**无声、无文本存储功能**（考场规定）\n- **价格区间**：约 150—200 元\n- **重要**：**现在就买，从今天起就用它做题**。考场上换一台不熟的计算器，是真的会出事的\n\n---\n\n## 三、现阶段不要买\n\n| 不要买 | 原因 |\n|---|---|\n| 专业考试任何资料 | 2028 年的事，现在买就是吃灰 |\n| 规范汇编 / 设计手册 | 基础考试**闭卷**，一本都带不进考场 |\n| 各种\"押题卷\"\"密卷\"\"内部资料\" | 基础考试押不中，纯属智商税 |\n| 网课全家桶 | 你是本专业，公共基础里只有高数和力学需要补，单买这两块就够 |\n| 旧版教材（两年前及更早） | 考纲微调过，别省这几十块 |\n\n---\n\n## 四、免费且合法的资源（重点看这条）\n\n| 资源 | 在哪拿 | 用途 |\n|---|---|---|\n| **考试大纲** | 各省人事考试网 / 住建部执业资格注册中心（pqrc.org.cn） | 免费。**用来划范围**——大纲里没有的，一律不看 |\n| **报考通知、报名条件** | 同上 + 你所在省人事考试网 | 确认年限、社保、审核材料 |\n| **你本科的教材** | 自己书架上 | 高数、理论力学、材料力学、电路——**比任何辅导书都够用**，只是需要重新捡起来 |\n| **大学公开课**（B站/中国大学MOOC） | 搜索\"高等数学 同济\"、\"理论力学\" | 只看你不会的那几章，不要从头刷 |\n\n> 关于大纲：它最大的作用是**帮你砍掉 30% 不考的内容**。拿到手第一件事不是读，是对着目录划掉不考的章节。\n\n---\n\n## 五、如果一本都不想买\n\n**最低配置**：真题集 + 你本科教材 + 免费大纲。\n\n理论上够过 132 分——因为你是本专业，下午那 120 分本来就该拿 80% 以上。\n\n但**不建议**：没有系统整理的教程，你得自己在四本大学教材里找对应章节，时间成本远高于一本书的钱。\n\n---\n\n## 六、关于\"网上找 PDF\"\n\n我不会去找盗版 PDF。三个实际理由，不是道德说教：\n\n1. **错漏**：扫描版教材错 /* ============================================================
   迷你 Markdown → 块结构
   ============================================================ */
function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function inline(s) {
  // 先保护行内代码，避免内部被二次处理
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (m, c) => {
    codes.push(c);
    return '\u0000C' + (codes.length - 1) + '\u0000';
  });
  s = esc(s);
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  // 原文里的 <br> 是有意断行
  s = s.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
  s = s.replace(/\u0000C(\d+)\u0000/g, (m, i) => '<code>' + esc(codes[+i]) + '</code>');
  return s;
}
function isTableSep(line) {
  return /^\s*\|?[\s:|-]*-[\s:|-]*\|?\s*$/.test(line) && line.indexOf('-') >= 0 && line.indexOf('|') >= 0;
}
function splitRow(line) {
  let t = line.trim();
  if (t.startsWith('|')) t = t.slice(1);
  if (t.endsWith('|')) t = t.slice(0, -1);
  return t.split('|').map(c => c.trim());
}
function mdToBlocks(md) {
  const lines = md.replace(/\r\n?/g, '\n').split('\n');
  const blocks = [];
  let i = 0;

  const push = (type, html, extra) => {
    const text = html.replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
    blocks.push(Object.assign({ type, html, text }, extra || {}));
  };

  while (i < lines.length) {
    let line = lines[i];

    if (!line.trim()) { i++; continue; }

    // hr
    if (/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(line) && line.trim().length >= 3) {
      push('hr', '<hr>'); i++; continue;
    }
    // heading
    let hm = line.match(/^(#{1,6})\s+(.*)$/);
    if (hm) {
      const lvl = Math.min(hm[1].length, 4);
      push('h', '<h' + lvl + '>' + inline(hm[2].trim()) + '</h' + lvl + '>', { level: lvl });
      i++; continue;
    }
    // table
    if (line.indexOf('|') >= 0 && i + 1 < lines.length && isTableSep(lines[i + 1])) {
      const head = splitRow(line);
      i += 2;
      const rows = [];
      while (i < lines.length && lines[i].indexOf('|') >= 0 && lines[i].trim()) {
        rows.push(splitRow(lines[i])); i++;
      }
      let h = '<div class="tw"><table><thead><tr>';
      head.forEach(c => { h += '<th>' + inline(c) + '</th>'; });
      h += '</tr></thead><tbody>';
      rows.forEach(r => {
        h += '<tr>';
        for (let k = 0; k < head.length; k++) h += '<td>' + inline(r[k] == null ? '' : r[k]) + '</td>';
        h += '</tr>';
      });
      h += '</tbody></table></div>';
      push('table', h, { rowCount: rows.length });
      continue;
    }
    // blockquote
    if (/^\s*>\s?/.test(line)) {
      const buf = [];
      while (i < lines.length && /^\s*>\s?/.test(lines[i])) {
        buf.push(lines[i].replace(/^\s*>\s?/, '')); i++;
      }
      const inner = buf.filter(x => x.trim()).map(x => '<p>' + inline(x) + '</p>').join('');
      push('quote', '<blockquote>' + inner + '</blockquote>');
      continue;
    }
    // list
    if (/^\s*([-*+]|\d+[.)])\s+/.test(line)) {
      const ordered = /^\s*\d+[.)]\s+/.test(line);
      const items = [];
      while (i < lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])) {
        const m = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        items.push({ indent: m[1].replace(/\t/g, '  ').length, text: m[3] });
        i++;
        // 续行（缩进的非列表行）
        while (i < lines.length && lines[i].trim() && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])
               && !/^\s*>/.test(lines[i]) && !/^#{1,6}\s/.test(lines[i])
               && lines[i].indexOf('|') < 0) {
          items[items.length - 1].text += ' ' + lines[i].trim();
          i++;
        }
      }
      push('list', renderList(items, ordered), { ordered });
      continue;
    }
    // paragraph
    const buf = [];
    while (i < lines.length && lines[i].trim()
           && !/^#{1,6}\s/.test(lines[i]) && !/^\s*>/.test(lines[i])
           && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])
           && !(lines[i].indexOf('|') >= 0 && i + 1 < lines.length && isTableSep(lines[i + 1]))
           && !/^\s*([-*_])\s*\1\s*\1[\s\-*_]*$/.test(lines[i])) {
      buf.push(lines[i].trim()); i++;
    }
    if (buf.length) push('p', '<p>' + inline(buf.join(' ')) + '</p>');
    else i++;
  }
  return blocks;
}
function renderList(items, ordered) {
  const tag = ordered ? 'ol' : 'ul';
  const base = Math.min.apply(null, items.map(x => x.indent));
  const root = { children: [] };
  const stack = [{ node: root, indent: base - 2 }];
  items.forEach(it => {
    while (stack.length > 1 && it.indent <= stack[stack.length - 1].indent) stack.pop();
    const node = { text: it.text, children: [] };
    stack[stack.length - 1].node.children.push(node);
    stack.push({ node, indent: it.indent });
  });
  const walk = nodes => '<' + tag + '>' + nodes.map(n =>
    '<li>' + inline(n.text) + (n.children.length ? walk(n.children) : '') + '</li>'
  ).join('') + '</' + tag + '>';
  return walk(root.children);
}

});

  else if (state.route === 'marks') v.innerHTML = viewMarks();
  else if (doc) v.innerHTML = viewDoc(doc);
  else { v.innerHTML = viewHome(); }

  renderNav(document.getElementById('navDesktop'));
  renderNav(document.getElementById('navMobile'));
  bindMarks(v);
  if (doc) bindVideo(v);

  // 首页卡片点击
  v.querySelectorAll('[data-go]').forEach(el => {
    el.onclick = () => go(el.dataset.go);
  });
  v.querySelectorAll('[data-act]').forEach(el => {
    el.onclick = actHandler(el.dataset.act);
  });
  window.scrollTo(0, 0);
}

function viewHome() {
  const total = countMarks();
  let h = '<div class="hero">';
  h += '<h1>注册电气工程师 · 基础考试知识库</h1>';
  h += '<p>2027 年目标基础考试（发输变电）。合格线 132 / 240 分。这份页面是你四份速查表与两份策略文档的合并版，可离线打开，标记存在本机。</p>';
  h += '<div class="stats">';
  h += '<div class="stat hi"><b>132</b><small>合格线 / 240 分（55%）</small></div>';
  h += '<div class="stat"><b>240</b><small>全部单选题</small></div>';
  h += '<div class="stat"><b>300–400</b><small>建议投入小时</small></div>';
  h += '<div class="stat mk"><b>' + total + '</b><small>你圈的重点</small></div>';
  h += '</div></div>';

  h += '<div class="cards">';
  DATA.docs.forEach(d => {
    const n = countMarks(d.id);
    h += '<button class="card" data-go="' + d.id + '">'
      + '<div class="ct">' + esc(d.title) + '</div>'
      + '<div class="cd">' + esc(d.sub) + '</div>'
      + '<div class="cb">' + d.pills.map(p => '<span class="pill' + (p.k ? ' ' + p.k : '') + '">' + esc(p.t) + '</span>').join('')
      + (n ? '<span class="pill m">圈了 ' + n + '</span>' : '')
      + '</div></button>';
  });
  h += '</div>';

  h += '<div class="banner"><span>💡</span><span><b>怎么用</b>：点任意段落、列表项或表格行可圈重点（再点取消），自动保存在本机。开「自测」后关键公式会变模糊，点一下才显示——考前拿它当抽认卡。</span></div>';
  h += '<div class="toolbar">'
    + '<button class="iconbtn" data-act="export">导出标记</button>'
    + '<button class="iconbtn" data-act="import">导入标记</button>'
    + '<button class="iconbtn" data-act="clear">清空标记</button>'
    + '<button class="iconbtn" data-act="print">打印 / 存 PDF</button>'
    + '</div>';
  return h;
}

function viewDoc(doc) {
  let vidsHtml = '';
  if (doc.videos && doc.videos.length) {
    doc.videos.forEach((vid, idx) => {
      vidsHtml += '<div class="videowrap" data-vid="' + idx + '">'
        + '<h3>' + esc(vid.title) + '</h3>'
        + '<p class="vs">' + esc(vid.sub) + '</p>'
        + '<video controls preload="metadata" playsinline poster="data:image/jpeg;base64,' + vid.poster
          + '" src="' + (vid.src || ('data:video/mp4;base64,' + vid.b64)) + '"></video>'
        + '</div>';
    });
  }

  let h = '<div class="doc" data-doc="' + doc.id + '">';
  let placed = false;
  doc.blocks.forEach(b => {
    if (b.type === 'h') {
      const on = state.marks.has(b.key) ? ' on' : '';
      h += '<h' + b.level + ' class="mk' + on + '" data-key="' + b.key + '">'
        + b.html.replace(/^<h\d>|<\/h\d>$/g, '') + '</h' + b.level + '>';
      // 视频跟着对应小节走
      if (!placed && vidsHtml && (b.text || '').indexOf('空间解析几何') >= 0) {
        h += vidsHtml; placed = true;
      }
    } else if (b.type === 'list') {
      h += '<div class="listblock" data-key="' + b.key + '">' + b.html + '</div>';
    } else if (b.type === 'table') {
      h += b.html.replace('<div class="tw">', '<div class="tw" data-ti="' + b.ti + '" data-key="' + b.key + '">');
    } else if (b.type === 'hr') {
      h += '<hr>';
    } else {
      const on = state.marks.has(b.key) ? ' on' : '';
      h += b.html.replace(/^<(\w+)/, '<$1 class="mk' + on + '" data-key="' + b.key + '"');
    }
  });
  if (!placed && vidsHtml) h += vidsHtml;
  h += '</div>';
  return h;
}

function blockHasMarks(d, b) {
  if (state.marks.has(b.key)) return true;
  if (b.type === 'table') {
    for (let r = 0; r < (b.rowCount || 0); r++) {
      if (state.marks.has(d.id + ':t' + b.ti + ':r' + r)) return true;
    }
  }
  if (b.type === 'list') {
    for (let i = 0; i < (b.liCount || 0); i++) {
      if (state.marks.has(b.key + '#' + i)) return true;
    }
  }
  return false;
}
function emitBlock(b) {
  if (b.type === 'h') {
    const on = state.marks.has(b.key) ? ' on' : '';
    return '<h' + b.level + ' class="mk' + on + '" data-key="' + b.key + '">'
      + b.html.replace(/^<h\d>|<\/h\d>$/g, '') + '</h' + b.level + '>';
  }
  if (b.type === 'table') return b.html.replace('<div class="tw">', '<div class="tw" data-ti="' + b.ti + '" data-key="' + b.key + '">');
  if (b.type === 'list') return '<div class="listblock" data-key="' + b.key + '">' + b.html + '</div>';
  if (b.type === 'hr') return '<hr>';
  const on = state.marks.has(b.key) ? ' on' : '';
  return b.html.replace(/^<(\w+)/, '<$1 class="mk' + on + '" data-key="' + b.key + '"');
}
function viewMarks() {
  let h = '<h1 style="font-size:23px;margin:4px 0 6px">我的标记</h1>';
  if (!state.marks.size) {
    h += '<div class="banner"><span>—</span><span>还没有圈任何内容。回到任意章节，点一下段落、列表项或表格行即可标记。</span></div>';
    h += '<div class="toolbar"><button class="iconbtn" data-act="import">导入标记</button></div>';
    return h;
  }
  DATA.docs.forEach(d => {
    const picked = d.blocks.filter(b => b.type !== 'hr' && blockHasMarks(d, b));
    if (!picked.length) return;
    h += '<div class="doc" data-doc="' + d.id + '">';
    h += '<h2>' + esc(d.title) + ' <span class="pill m">' + picked.length + '</span></h2>';
    picked.forEach(b => { h += emitBlock(b); });
    h += '<div class="toolbar"><button class="iconbtn" data-go="' + d.id + '">打开整章</button></div>';
    h += '</div>';
  });
  h += '<div class="toolbar" style="margin-top:26px"><button class="iconbtn" data-act="export">导出标记</button>'
    + '<button class="iconbtn" data-act="clear">清空标记</button></div>';
  return h;
}

/* ============================================================
   标记交互
   ============================================================ */
function bindMarks(root) {
  root.querySelectorAll('.doc[data-doc]').forEach(container => {
    const docId = container.dataset.doc;

    // 段落 / 标题 / 引用
    container.querySelectorAll('.mk[data-key]').forEach(el => {
      el.addEventListener('click', e => {
        if (e.target.tagName === 'A') return;
        if (state.blur && (e.target.tagName === 'STRONG' || e.target.tagName === 'CODE')) return;
        toggleMark(el.dataset.key, el);
      });
    });

    // 列表项：docId:blockIdx + 序号
    container.querySelectorAll('.listblock[data-key]').forEach(wrap => {
      wrap.querySelectorAll('li').forEach((li, idx) => {
        const key = wrap.dataset.key + '#' + idx;
        li.dataset.key = key;
        li.classList.add('mk');
        if (state.marks.has(key)) li.classList.add('on');
        li.addEventListener('click', e => {
          if (e.target.tagName === 'A') return;
          if (state.blur && (e.target.tagName === 'STRONG' || e.target.tagName === 'CODE')) return;
          e.stopPropagation();
          toggleMark(key, li);
        });
      });
    });

    // 表格行：docId:t<表序号>:r<行序号>，与路由无关，切页不会错位
    container.querySelectorAll('.tw[data-ti]').forEach(tw => {
      const ti = tw.dataset.ti;
      tw.querySelectorAll('tbody tr').forEach((tr, idx) => {
        const key = docId + ':t' + ti + ':r' + idx;
        tr.dataset.key = key;
        tr.classList.add('mk');
        if (state.marks.has(key)) tr.classList.add('on');
        tr.addEventListener('click', e => {
          if (e.target.tagName === 'A') return;
          if (state.blur && (e.target.tagName === 'STRONG' || e.target.tagName === 'CODE')) return;
          toggleMark(key, tr);
        });
      });
    });
  });

  // 自测模式：点开模糊的公式
  if (state.blur) {
    root.querySelectorAll('.doc strong, .doc code').forEach(el => {
      el.addEventListener('click', e => {
        e.stopPropagation();
        el.classList.toggle('revealed');
      });
    });
  }
}
function toggleMark(key, el) {
  if (state.marks.has(key)) { state.marks.delete(key); el.classList.remove('on'); }
  else { state.marks.add(key); el.classList.add('on'); }
  saveMarks();
  renderNav(document.getElementById('navDesktop'));
  renderNav(document.getElementById('navMobile'));
}

/* ============================================================
   视频
   ============================================================ */
function bindVideo(root) {
  root.querySelectorAll('video').forEach(v => {
    v.addEventListener('error', () => {
      const w = v.closest('.videowrap');
      if (w && !w.querySelector('.verr')) {
        const p = document.createElement('p');
        p.className = 'verr';
        p.style.cssText = 'color:var(--danger);font-size:12.5px;margin:8px 0 0';
        p.textContent = '视频无法在内嵌页播放，请直接打开同目录下的 mp4 文件。';
        w.appendChild(p);
      }
    });
  });
}

/* ============================================================
   搜索
   ============================================================ */
const INDEX = [];
DATA.docs.forEach(d => {
  d.blocks.forEach(b => {
    if (b.type === 'hr') return;
    if (b.text && b.text.length > 1) {
      INDEX.push({ doc: d, key: b.key, text: b.text, html: b.html, type: b.type });
    }
  });
});
function openSearch() {
  document.getElementById('overlay').classList.add('open');
  const q = document.getElementById('q');
  q.value = ''; q.focus();
  document.getElementById('results').innerHTML =
    '<div class="empty">输入关键词，搜索全部 ' + INDEX.length + ' 个段落</div>';
}
function closeSearch() { document.getElementById('overlay').classList.remove('open'); }
function scrollToKey(key) {
  let tries = 0;
  const attempt = () => {
    const target = document.querySelector('[data-key="' + key + '"]');
    if (target) {
      const top = target.getBoundingClientRect().top + window.scrollY - 72;
      window.scrollTo({ top: Math.max(0, top), behavior: 'auto' });
      target.style.transition = 'background .45s';
      const old = target.style.background;
      target.style.background = 'var(--accent-soft)';
      setTimeout(() => { target.style.background = old; }, 1600);
      return;
    }
    if (++tries < 5) setTimeout(attempt, 90);
    else toast('已定位章节，请在该章内查找');
  };
  setTimeout(attempt, 50);
}
function doSearch(term) {
  const box = document.getElementById('results');
  const t = term.trim().toLowerCase();
  if (!t) {
    box.innerHTML = '<div class="empty">输入关键词，搜索全部 ' + INDEX.length + ' 个段落</div>';
    return;
  }
  const hits = [];
  for (const item of INDEX) {
    const lt = item.text.toLowerCase();
    const at = lt.indexOf(t);
    if (at < 0) continue;
    hits.push({ item, at });
    if (hits.length >= 60) break;
  }
  if (!hits.length) {
    box.innerHTML = '<div class="empty">没有找到「' + esc(term) + '」</div>';
    return;
  }
  box.innerHTML = hits.map((h, i) => {
    const txt = h.item.text;
    const s = Math.max(0, h.at - 22);
    const e = Math.min(txt.length, h.at + t.length + 46);
    let snippet = (s > 0 ? '…' : '') + esc(txt.slice(s, h.at))
      + '<mark>' + esc(txt.slice(h.at, h.at + t.length)) + '</mark>'
      + esc(txt.slice(h.at + t.length, e)) + (e < txt.length ? '…' : '');
    return '<button class="result" data-doc="' + h.item.doc.id + '" data-key="' + h.item.key + '">'
      + '<div class="rr">' + esc(h.item.doc.title) + '</div>'
      + '<div class="rt">' + snippet + '</div></button>';
  }).join('');
  box.querySelectorAll('.result').forEach(b => {
    b.onclick = () => {
      const docId = b.dataset.doc, key = b.dataset.key;
      closeSearch();
      state.route = docId;
      location.hash = '#/' + docId;
      render();
      scrollToKey(key);
    };
  });
}

/* ============================================================
   导入 / 导出
   ============================================================ */
function actHandler(act) {
  return function () {
    if (act === 'export') {
      const data = { version: 1, exportedAt: new Date().toISOString(), marks: Array.from(state.marks) };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = '注电知识库-标记-' + new Date().toISOString().slice(0, 10) + '.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 3000);
      toast('已导出 ' + state.marks.size + ' 条标记');
    } else if (act === 'import') {
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = () => {
        const f = inp.files && inp.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = () => {
          try {
            const obj = JSON.parse(r.result);
            const arr = Array.isArray(obj) ? obj : obj.marks;
            if (!Array.isArray(arr)) throw new Error('格式不对');
            arr.forEach(k => state.marks.add(String(k)));
            saveMarks(); render(); toast('已导入，共 ' + state.marks.size + ' 条');
          } catch (e) { toast('导入失败：文件格式不正确'); }
        };
        r.readAsText(f);
      };
      inp.click();
    } else if (act === 'clear') {
      if (!state.marks.size) { toast('还没有标记'); return; }
      if (!confirm('确定清空全部 ' + state.marks.size + ' 条标记？此操作不可撤销。')) return;
      state.marks.clear(); saveMarks(); render(); toast('已清空');
    } else if (act === 'print') {
      window.print();
    }
  };
}

/* ============================================================
   抽屉 / 主题 / 事件
   ============================================================ */
function openDrawer() { document.getElementById('drawer').classList.add('open'); }
function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }

document.getElementById('menuBtn').onclick = openDrawer;
document.getElementById('searchBtn').onclick = openSearch;
document.getElementById('themeBtn').onclick = () => {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  store.set('theme2', state.theme); applyTheme();
};
document.getElementById('blurBtn').onclick = function () {
  state.blur = !state.blur;
  store.set('blur', state.blur);
  this.setAttribute('aria-pressed', String(state.blur));
  document.body.classList.toggle('blur', state.blur);
  render();
  toast(state.blur ? '自测模式：点公式显示答案' : '自测模式已关闭');
};
document.getElementById('q').addEventListener('input', e => doSearch(e.target.value));
document.addEventListener('click', e => {
  if (e.target.dataset && e.target.dataset.close) { closeSearch(); closeDrawer(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeSearch(); closeDrawer(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openSearch(); }
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); openSearch(); }
});
window.addEventListener('hashchange', () => {
  const id = (location.hash || '').replace(/^#\/?/, '') || 'home';
  if (id !== state.route) { state.route = id; render(); }
});

/* 移动端：显示菜单按钮 */
function syncMenuBtn() {
  document.getElementById('menuBtn').style.display = window.innerWidth < 900 ? '' : 'none';
  document.querySelector('#searchBtn .lbl').style.display = window.innerWidth >= 900 ? '' : 'none';
}
window.addEventListener('resize', syncMenuBtn);

/* ============================================================
   启动
   ============================================================ */
applyTheme();
if (state.blur) {
  document.body.classList.add('blur');
  document.getElementById('blurBtn').setAttribute('aria-pressed', 'true');
}
state.route = (location.hash || '').replace(/^#\/?/, '') || 'home';
if (!ROUTES.some(r => r.id === state.route)) state.route = 'home';
syncMenuBtn();
render();
</script>
